<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐皓萱 Hazel Xu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --void:#f7f5f1;
  --ink:#1c1a17;
  --ink-2:rgba(28,26,23,.76);
  --ink-3:rgba(28,26,23,.54);
  --ink-4:rgba(28,26,23,.36);
  --hair:rgba(28,26,23,.14);
  --hair-2:rgba(28,26,23,.075);
  --gold:#a05a32;
  --gold-2:#8a4a28;
  --sky:#5b86b0;
  --serif:'Newsreader','Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Inter','Noto Sans SC',ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif;
  --bgimg:url('img/aura.jpg');
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);line-height:1.62;background:var(--void);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;background:none;border:0;cursor:pointer;color:inherit}
::selection{background:rgba(160,90,50,.16)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
svg{display:block}

/* 全站弥散光背景 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:var(--bgimg);background-size:cover;background-position:center;
  opacity:.88;
}
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(248,247,244,.12) 0%,transparent 30%,transparent 70%,rgba(248,247,244,.08) 100%);
}

.scroller{position:relative;z-index:3;height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.scroller::-webkit-scrollbar{width:0}
.sec{
  height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  padding:clamp(58px,7.4vh,92px) clamp(28px,5vw,96px) clamp(22px,3vh,42px);
}

/* 顶栏 */
.top{
  position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;justify-content:flex-end;
  padding:clamp(17px,2.2vh,26px) clamp(28px,5vw,96px);
}
.top .bd{font-family:var(--serif);font-size:15.5px;font-weight:400;letter-spacing:.01em}
.top nav{margin-left:auto;display:flex;gap:clamp(13px,1.8vw,28px)}
.top nav button{
  position:relative;padding:3px 1px;font-size:10.5px;font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-4);transition:color .4s;
}
.top nav button::after{
  content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .58s cubic-bezier(.19,1,.22,1);
}
.top nav button:hover{color:var(--ink-2)}
.top nav button.on{color:var(--ink)}
.top nav button.on::after{transform:scaleX(1)}

.prog{position:fixed;left:0;bottom:0;height:1px;width:100%;z-index:69;background:var(--hair-2)}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .24s linear}

.rise{opacity:0;transform:translateY(18px);transition:opacity .95s cubic-bezier(.19,1,.22,1),transform .95s cubic-bezier(.19,1,.22,1)}
.sec.in .rise{opacity:1;transform:none}
.sec.in .d1{transition-delay:.09s}
.sec.in .d2{transition-delay:.18s}
.sec.in .d3{transition-delay:.27s}

/* 板块标头：斜体衬线 + 长横线，非居中 */
.bh{display:flex;align-items:baseline;gap:clamp(11px,1.5vw,20px);flex-shrink:0}
.bh h2{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.4vw,22px);font-weight:400;letter-spacing:.005em;white-space:nowrap;color:var(--ink-2)}
.bh .rule{flex:1;height:1px;background:var(--hair);min-width:12px}
.bh .tag{font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap}

/* ============ 1 · 首页：非对称版面 ============ */
#s-home{
  display:grid;
  grid-template-columns:minmax(0,1.42fr) minmax(0,.86fr);
  grid-template-rows:auto minmax(0,1fr);
  column-gap:clamp(26px,4vw,74px);row-gap:clamp(15px,2.3vh,34px);
}
/* 左上：姓名 + 学历，错落排布 */
.lead{grid-column:1;grid-row:1;min-width:0}
.lead .ttl{font-family:var(--serif);font-size:clamp(48px,7vw,112px);font-weight:400;letter-spacing:-.045em;line-height:.88}
.lead .ttl em{font-style:normal;font-weight:300}
.lead .sub{margin-top:clamp(12px,1.9vh,22px);display:flex;align-items:center;gap:clamp(11px,1.5vw,20px);flex-wrap:wrap}
.lead .sub .lat{font-size:10.5px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.lead .sub .bar{width:clamp(18px,2.4vw,40px);height:1px;background:var(--hair)}
.lead .sub .rl{font-family:var(--serif);font-style:italic;font-size:13px;font-weight:400;color:var(--ink-2)}

/* 学历：紧跟姓名，缩进对齐 */
.edu{margin-top:clamp(18px,2.8vh,40px);display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);max-width:min(100%,540px)}
.edu .e{display:flex;align-items:baseline;gap:clamp(10px,1.3vw,18px);position:relative;padding-left:clamp(13px,1.5vw,22px);transition:padding-left .58s cubic-bezier(.19,1,.22,1)}
.edu .e::before{
  content:'';position:absolute;left:0;top:.62em;width:clamp(6px,.7vw,11px);height:1px;background:var(--ink-4);
  transition:width .58s cubic-bezier(.19,1,.22,1),background .4s;
}
.edu .e:hover{padding-left:clamp(20px,2.2vw,32px)}
.edu .e:hover::before{width:clamp(13px,1.4vw,21px);background:var(--gold)}
.edu .e b{font-family:var(--serif);font-size:clamp(16px,1.5vw,24px);font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.edu .e s{text-decoration:none;font-size:clamp(10px,.82vw,12px);color:var(--ink-3);font-weight:400}
.edu .e u{text-decoration:none;font-size:10px;font-weight:400;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap;transition:color .4s}
.edu .e:hover u{color:var(--gold-2)}

/* 右上：肖像 + 能力叠加，不是并排卡片 */
.side{grid-column:2;grid-row:1;min-width:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:clamp(14px,1.8vw,30px)}
.side .pf{position:relative;width:min(100%,clamp(150px,17vw,250px));flex-shrink:0}
.side .pf img{width:100%;height:auto;max-height:34vh;object-fit:contain;object-position:bottom right;
  filter:none contrast(1.02) drop-shadow(0 14px 32px rgba(28,26,23,.1))}
/* 能力：错落列，非等分格 */
.caps{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(11px,1.7vh,22px);padding-top:clamp(4px,.8vh,12px)}
.capC{cursor:default;transition:transform .5s cubic-bezier(.19,1,.22,1)}
.capC:nth-child(2){margin-left:clamp(9px,1.3vw,22px)}
.capC:nth-child(3){margin-left:clamp(18px,2.6vw,44px)}
.capC:hover{transform:translateX(4px)}
.capC .v{font-family:var(--serif);font-size:clamp(26px,2.8vw,46px);font-weight:400;letter-spacing:-.04em;line-height:1;color:var(--gold);transition:color .45s}
.capC:hover .v{color:var(--gold-2)}
.capC .lb{font-size:10.5px;font-weight:500;margin-top:6px;color:var(--ink)}
.capC .sb{font-size:9px;font-weight:400;color:var(--ink-4);margin-top:2px;line-height:1.5}

/* 实习经历：横向时间坐标轴，可拖动 */
.xp{grid-column:1 / -1;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,18px)}

.axwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
/* 拖动视口 */
.axview{
  flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;
  cursor:grab;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
.axview::-webkit-scrollbar{height:0}
.axview.grabbing{cursor:grabbing}
.axview.grabbing .xc{pointer-events:none}
.axview.grabbing,.axview.grabbing *{user-select:none;-webkit-user-select:none}

/* 轨道：内容宽度由卡片决定 */
.axrail{
  position:relative;height:100%;display:flex;align-items:stretch;
  padding:clamp(26px,3.6vh,44px) clamp(6px,1vw,16px) 0;
  min-width:max-content;
}
/* 坐标轴基线 */
.axrail::before{
  content:'';position:absolute;left:0;right:0;top:clamp(26px,3.6vh,44px);height:1px;
  background:linear-gradient(90deg,var(--hair) 0%,var(--hair) 88%,transparent 100%);
}

/* 单个经历节点 */
.xc{
  position:relative;flex:0 0 clamp(252px,21vw,318px);
  display:flex;flex-direction:column;
  padding:0 clamp(15px,1.5vw,24px) clamp(12px,1.7vh,20px);
  transition:background .5s cubic-bezier(.19,1,.22,1);
}
.xc + .xc{border-left:1px solid var(--hair-2)}
.xc .inner{padding-top:clamp(17px,2.4vh,28px);padding-bottom:clamp(4px,.8vh,10px);display:flex;flex-direction:column}
/* 轴点：坐落在轨道基线上 */
.xc::before{
  content:'';position:absolute;left:clamp(15px,1.5vw,24px);top:0;
  width:7px;height:7px;border-radius:50%;
  background:var(--void);border:1px solid var(--ink-4);
  transform:translateY(-50%);z-index:2;
  transition:all .5s cubic-bezier(.19,1,.22,1);
}
.xc:hover::before{border-color:var(--gold);background:var(--gold);transform:translateY(-50%) scale(1.3)}
.xc.now::before{border-color:var(--gold);background:var(--gold);width:9px;height:9px;box-shadow:0 0 0 4px rgba(160,90,50,.13)}
.xc:hover{background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 74%)}
.xc.now{background:linear-gradient(180deg,rgba(160,90,50,.055),transparent 72%)}

.xc .wn{font-size:9.5px;font-weight:500;letter-spacing:.08em;color:var(--ink-3)}
.xc.now .wn{color:var(--gold-2)}
.xc .og{font-family:var(--serif);font-size:clamp(15px,1.42vw,22px);font-weight:500;letter-spacing:-.022em;line-height:1.28;margin-top:9px}
.xc.now .og{font-size:clamp(16px,1.6vw,25px)}
.xc .rl{font-size:9.5px;font-weight:400;color:var(--ink-3);margin-top:6px;line-height:1.5}
.xc .kn{margin-top:clamp(13px,2.1vh,26px)}
.xc .kn .kv{font-family:var(--serif);font-size:clamp(27px,2.9vw,44px);font-weight:400;letter-spacing:-.042em;line-height:1;color:var(--gold);transition:color .5s}
.xc.now .kn .kv{font-size:clamp(31px,3.4vw,54px)}
.xc .kn .kk{font-size:9px;font-weight:400;color:var(--ink-2);margin-top:7px;line-height:1.5}
.xc .more{margin-top:clamp(15px,2.2vh,26px);padding-top:clamp(9px,1.3vh,14px);border-top:1px solid var(--hair-2);display:flex;flex-direction:column;gap:5px}
.xc .more i{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-4);display:flex;gap:7px;line-height:1.5}
.xc .more i b{font-weight:500;color:var(--ink-2);flex-shrink:0}

/* 拖动提示 */
.axhint{
  flex-shrink:0;display:flex;align-items:center;gap:10px;margin-top:clamp(6px,.9vh,11px);
  font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
}
.axhint .ln{flex:1;height:1px;background:var(--hair-2);position:relative;overflow:hidden}
.axhint .ln i{position:absolute;left:0;top:0;height:100%;background:var(--gold);width:0;transition:width .22s linear}
.axhint svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}

@media(max-width:1180px){
  #s-home{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
  .xpg{grid-template-columns:1.4fr 1fr 1fr;overflow-y:auto}
  .xc:nth-child(4){border-left:0}
}
@media(max-width:800px){
  #s-home{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .lead{grid-row:1}
  .side{grid-column:1;grid-row:2;max-height:20vh;align-items:flex-end}
  .side .pf{width:clamp(96px,26vw,140px)}
  .side .pf img{max-height:20vh}
  .caps{max-width:60%}
  .xp{grid-column:1;grid-row:3}
  .lead .ttl{font-size:clamp(34px,10vw,54px)}
  .xpg{grid-template-columns:1.3fr 1fr}
  .xc:nth-child(3){border-left:0}
  .xc .more{display:none}
}

/* ============ 2 · 作品：3D 立体卡 ============ */
#s-work{display:flex;flex-direction:column;gap:clamp(9px,1.4vh,18px)}
.wwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,16px)}

.stage{
  flex:1;min-height:0;position:relative;
  perspective:2000px;perspective-origin:50% 50%;
  cursor:grab;touch-action:pan-y;
}
.stage.grabbing{cursor:grabbing}
.stage.grabbing .fc{transition:none!important}
.track{position:absolute;inset:0;transform-style:preserve-3d}

/* 卡片：中心卡是主角，够大够清楚 */
.fc{
  position:absolute;left:50%;top:50%;
  width:clamp(300px,27vw,410px);height:min(88%,520px);
  margin-left:calc(clamp(300px,27vw,410px) / -2);
  margin-top:calc(min(88%,520px) / -2);
  transform-style:preserve-3d;
  transition:transform .78s cubic-bezier(.19,1,.22,1),opacity .5s,filter .5s;
  will-change:transform,opacity;
  display:block;
}
.fc .face{
  position:absolute;inset:0;overflow:hidden;border-radius:16px;
  background:#fff;border:1px solid var(--hair-2);
  display:flex;flex-direction:column;
  transition:box-shadow .6s,border-color .6s;
}
/* 中心卡：厚重投影托起立体感 */
.fc.on .face{
  border-color:var(--hair);
  box-shadow:
    0 42px 84px -30px rgba(28,26,23,.3),
    0 14px 30px -14px rgba(28,26,23,.14),
    0 2px 6px rgba(28,26,23,.05);
}
.fc.on:hover .face{
  border-color:rgba(160,90,50,.44);
  box-shadow:
    0 52px 100px -32px rgba(28,26,23,.34),
    0 16px 34px -14px rgba(28,26,23,.16),
    0 2px 6px rgba(28,26,23,.05);
}
/* 侧卡：弱化，只作景深 */
.fc:not(.on) .face{box-shadow:0 20px 44px -22px rgba(28,26,23,.16)}

/* 封面 */
.fc .shot{position:relative;width:100%;flex:0 0 50%;overflow:hidden;background:#f1efeb}
.fc .shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.19,1,.22,1)}
.fc.on:hover .shot img{transform:scale(1.045)}
.fc .shot::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 58%,rgba(255,255,255,.16));
}
.fc .idx{
  position:absolute;top:14px;left:16px;z-index:3;
  font-family:var(--serif);font-size:11.5px;font-weight:500;letter-spacing:.13em;color:#fff;
  text-shadow:0 1px 9px rgba(0,0,0,.55);
}
/* hover 才浮现的打开徽标 */
.fc .peek{
  position:absolute;top:12px;right:14px;z-index:4;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;
  background:rgba(255,255,255,.95);
  font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  opacity:0;transform:translateY(-5px);
  transition:opacity .4s cubic-bezier(.19,1,.22,1),transform .4s cubic-bezier(.19,1,.22,1);
}
.fc.on:hover .peek{opacity:1;transform:none}
.fc .peek svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2}

/* 信息区 */
.fc .meta{
  padding:clamp(13px,1.5vw,21px) clamp(15px,1.7vw,24px) clamp(12px,1.5vh,17px);
  display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;
}
.fc .og{font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.fc h3{
  font-family:var(--serif);font-size:clamp(17px,1.66vw,25px);font-weight:500;
  letter-spacing:-.026em;line-height:1.3;margin-top:8px;color:var(--ink);
}
/* 主数字 */
.fc .bg{margin-top:clamp(11px,1.6vh,18px);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fc .bg .v{
  font-family:var(--serif);font-size:clamp(30px,3vw,46px);font-weight:400;
  line-height:.96;letter-spacing:-.048em;color:var(--gold);
}
.fc .bg .k{font-size:9px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
/* 次级数据：只列 2 条，不堆 */
.fc .rows{margin-top:clamp(10px,1.5vh,15px);display:flex;flex-direction:column}
.fc .rows i{
  font-style:normal;display:flex;align-items:baseline;gap:10px;
  padding:clamp(5px,.75vh,8px) 0;border-top:1px solid var(--hair-2);
  font-size:9px;font-weight:400;color:var(--ink-4);line-height:1.5;
}
.fc .rows i b{
  font-family:var(--serif);font-size:13.5px;font-weight:500;color:var(--ink-2);
  flex-shrink:0;min-width:72px;letter-spacing:-.028em;
}
/* 底部跳转条 */
.fc .open{
  margin-top:auto;padding-top:clamp(11px,1.5vh,16px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--hair-2);
}
.fc .open span{
  font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-2);transition:letter-spacing .45s;
}
.fc .open .ic{
  width:29px;height:29px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(160,90,50,.34);display:flex;align-items:center;justify-content:center;
  color:var(--gold-2);transition:all .45s cubic-bezier(.19,1,.22,1);
}
.fc .open .ic svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.fc.on:hover .open span{letter-spacing:.23em}
.fc.on:hover .open .ic{background:var(--gold);border-color:var(--gold);color:#fff;transform:scale(1.12) rotate(45deg)}

/* 左右点击热区：侧卡即按钮 */
.fc:not(.on){cursor:pointer}

/* ---------- 底部：缩略进度 + 箭头 ---------- */
.wfoot{
  flex-shrink:0;display:flex;align-items:center;gap:clamp(12px,1.7vw,26px);
  border-top:1px solid var(--hair-2);padding-top:clamp(10px,1.4vh,15px);
}
.wnow{min-width:0;flex:1}
.wnow .l1{font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.wnow .l2{
  font-family:var(--serif);font-size:clamp(14px,1.32vw,20px);font-weight:500;
  letter-spacing:-.026em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 圆点进度：清楚显示位置 */
.dotrow{display:flex;gap:7px;flex-shrink:0;align-items:center}
.dotrow button{
  width:6px;height:6px;border-radius:50%;background:var(--hair);
  transition:all .5s cubic-bezier(.19,1,.22,1);
}
.dotrow button:hover{background:var(--ink-3);transform:scale(1.3)}
.dotrow button.on{width:22px;border-radius:3px;background:var(--gold)}
.wnav{display:flex;align-items:center;gap:clamp(10px,1.3vw,17px);flex-shrink:0}
.wnav .cnt{font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--ink-4)}
.wnav .cnt b{color:var(--ink);font-weight:500}
.wnav button.ar{
  width:clamp(33px,2.9vw,39px);height:clamp(33px,2.9vw,39px);border-radius:50%;
  border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:all .4s cubic-bezier(.19,1,.22,1);
}
.wnav button.ar svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}

/* 实习时间轴：拖动 + 进度条 */
(function(){
  var view=document.getElementById('axView'), bar=document.getElementById('axBar');
  if(!view) return;
  var down=false, sx=0, sl=0, target=0, raf=0;
  var RATE=1.35;   /* 位移放大，小幅拖动也有明显响应 */

  function apply(){
    raf=0;
    var max=view.scrollWidth-view.clientWidth;
    view.scrollLeft = Math.max(0, Math.min(max, target));
  }

  var axMobile = function(){ return window.matchMedia('(max-width:760px)').matches; };

  view.addEventListener('pointerdown', function(e){
    if (axMobile()) return;             /* 竖排下不接管手势 */
    if (e.pointerType==='mouse' && e.button!==0) return;
    down=true; sx=e.clientX; sl=view.scrollLeft; target=sl;
    view.classList.add('grabbing');
    try{ view.setPointerCapture(e.pointerId); }catch(err){}
    if (e.pointerType==='mouse') e.preventDefault();
  });
  view.addEventListener('pointermove', function(e){
    if(!down) return;
    e.preventDefault();
    target = sl - (e.clientX - sx) * RATE;
    if(!raf) raf=requestAnimationFrame(apply);   /* 每帧只写一次 */
  });
  function end(e){
    if(!down) return;
    down=false; view.classList.remove('grabbing');
    try{ view.releasePointerCapture(e.pointerId); }catch(err){}
  }
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  view.addEventListener('dragstart', function(e){ e.preventDefault(); });

  /* 竖向滚轮转横向，让触控板也能推 */
  view.addEventListener('wheel', function(e){
    if (axMobile()) return;
    var maxSL = view.scrollWidth - view.clientWidth;
    if (maxSL <= 1) return;
    var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    var next = view.scrollLeft + dx;
    if ((next <= 0 && dx < 0) || (next >= maxSL && dx > 0)) return;
    e.preventDefault();
    view.scrollLeft = next;
  }, {passive:false});

  function syncBar(){
    if (axMobile()){
      if (bar) bar.style.width='0%';
      /* 竖排：所有卡片同等呈现，不做 now 高亮 */
      [].slice.call(view.querySelectorAll('.xc')).forEach(function(c){ c.classList.remove('now'); });
      return;
    }
    var maxSL = view.scrollWidth - view.clientWidth;
    var pct = maxSL > 1 ? (view.scrollLeft / maxSL) : 0;
    if (bar) bar.style.width = (Math.min(1,Math.max(0,pct))*100).toFixed(1)+'%';
    /* 最靠近视口左缘的卡片高亮为 now */
    var xs=[].slice.call(view.querySelectorAll('.xc'));
    var vr=view.getBoundingClientRect(), best=0, bestD=1e9;
    xs.forEach(function(c,i){
      var r=c.getBoundingClientRect();
      var d=Math.abs(r.left - vr.left);
      if (d < bestD){ bestD=d; best=i; }
    });
    xs.forEach(function(c,i){ c.classList.toggle('now', i===best); });
  }
  view.addEventListener('scroll', syncBar);
  window.addEventListener('resize', syncBar);
  syncBar();
})();

/* ===== 作品：3D 立体卡 ===== */
var track=document.getElementById('track'), stage=document.getElementById('stage');
var dots=document.getElementById('dots'), wHint=document.getElementById('wHint');
var wOrg=document.getElementById('wOrg'), wTitle=document.getElementById('wTitle');
var wCnt=document.getElementById('wCnt');
var wPrev=document.getElementById('wPrev'), wNext=document.getElementById('wNext');
var cur=0, pos=0;

(function(){
  var h='';
  WORK.forEach(function(it,i){
    var rows='';
    it.rows.slice(1,3).forEach(function(x){ rows += '<i><b>'+x[0]+'</b>'+x[1]+'</i>'; });
    h += '<a class="fc" data-i="'+i+'" href="'+it.u+'" target="_blank" rel="noopener">'
       +   '<div class="face">'
       +     '<div class="shot">'
       +       '<span class="idx">'+(it.r<10?'0'+it.r:it.r)+'</span>'
       +       '<span class="peek">打开原文<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></span>'
       +       '<img src="'+it.img+'" alt="'+it.t+'" loading="lazy" draggable="false">'
       +     '</div>'
       +     '<div class="meta">'
       +       '<div class="og">'+it.org+'</div>'
       +       '<h3>'+it.t+'</h3>'
       +       '<div class="bg"><span class="v">'+it.big+'</span><span class="k">'+it.bigK+'</span></div>'
       +       '<div class="rows">'+rows+'</div>'
       +       '<div class="open"><span>打开原文</span>'
       +         '<i class="ic"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></i></div>'
       +     '</div>'
       +   '</div>'
       + '</a>';
  });
  track.innerHTML=h;
  var p='';
  WORK.forEach(function(it,i){ p += '<button data-i="'+i+'" aria-label="第 '+(i+1)+' 个"></button>'; });
  dots.innerHTML=p;
})();

var cards=[].slice.call(track.querySelectorAll('.fc'));

/* 3D 参数：侧卡只露窄边，不遮挡中心 */
var GAP  = 0.86;   // 相邻卡水平偏移（卡宽倍数）
var DEEP = 340;    // 每层后退深度
var TILT = 34;     // 侧卡 Y 轴旋转角
var VIS  = 2;      // 每侧可见层数

var isMobile = function(){ return window.matchMedia('(max-width:760px)').matches; };

function place(f){
  if (isMobile()){
    /* 手机端为竖向流式布局：清掉 inline 样式，避免覆盖 CSS */
    cards.forEach(function(c){
      c.style.transform=''; c.style.opacity=''; c.style.filter='';
      c.style.zIndex=''; c.style.pointerEvents='';
      c.classList.remove('on');
    });
    return;
  }
  var n = cards.length;
  var cw = cards.length ? cards[0].offsetWidth : 380;
  /* 把连续位置折进 0..n，保证 pos 长期累加也不失真 */
  var fm = ((f % n) + n) % n;
  cards.forEach(function(c,i){
    var off = i - fm;
    if (off >  n/2) off -= n;
    if (off < -n/2) off += n;
    var ab = Math.abs(off);
    if (ab > VIS + .6){
      c.style.opacity='0'; c.style.pointerEvents='none';
      c.style.transform='translateZ(-1100px) scale(.5)';
      c.classList.remove('on');
      return;
    }
    var x  = off * cw * GAP;
    var z  = -ab * DEEP;
    var ry = -Math.max(-1,Math.min(1,off)) * TILT * Math.min(1,ab);
    var sc = Math.max(.62, 1 - ab*0.1);
    c.style.opacity = String(Math.max(.12, 1 - ab*0.55));
    c.style.filter  = ab < .45 ? 'none' : 'blur('+Math.min(2.6, ab*1.15).toFixed(2)+'px)';
    c.style.zIndex  = String(50 - Math.round(ab*10));
    c.style.pointerEvents = 'auto';
    c.style.transform =
      'translateX('+x.toFixed(1)+'px) translateZ('+z.toFixed(1)+'px) '
      + 'rotateY('+ry.toFixed(2)+'deg) scale('+sc.toFixed(3)+')';
    c.classList.toggle('on', ab < .45);
  });
}
function sync(){
  if (isMobile()) return;
  [].slice.call(dots.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===cur); });
  var it=WORK[cur];
  wOrg.textContent=it.org; wTitle.textContent=it.t;
  wCnt.innerHTML='<b>'+(cur+1<10?'0'+(cur+1):cur+1)+'</b> / '+cards.length;
}

function layout(){ place(pos); sync(); }

/* pos 为连续位置（可超出 0..n-1），cur 为其取模结果 —— 两者始终同坐标系 */
function setPos(p){
  pos = p;
  var n = cards.length;
  cur = ((Math.round(p) % n) + n) % n;
  layout();
}
function go(i){
  var n = cards.length;
  i = ((i % n) + n) % n;
  if (i === cur) return;
  /* 取到目标的最短环形增量，保证只走最近的那条路 */
  var d = i - cur;
  if (d >  n/2) d -= n;
  if (d < -n/2) d += n;
  setPos(pos + d);
}

/* ---- 拖动跟手 ---- */
var dg=false, sx=0, sy=0, mx=0, my=0, base=0, horiz=null;
var THRESH=200;

function down(e){
  if (isMobile()) return;              /* 手机端由原生滚动接管 */
  if (e.button!==undefined && e.button!==0) return;
  dg=true; horiz=null; mx=0; my=0; base=pos;
  sx = e.touches ? e.touches[0].clientX : e.clientX;
  sy = e.touches ? e.touches[0].clientY : e.clientY;
  stage.classList.add('grabbing');
  if (wHint) wHint.classList.add('hide');
}
function move(e){
  if(!dg) return;
  var x = e.touches ? e.touches[0].clientX : e.clientX;
  var y = e.touches ? e.touches[0].clientY : e.clientY;
  mx = x-sx; my = y-sy;
  if (horiz===null && (Math.abs(mx)>7 || Math.abs(my)>7)) horiz = Math.abs(mx)>Math.abs(my);
  if (!horiz) return;
  if (e.cancelable) e.preventDefault();
  place(base - mx/THRESH);          /* 跟手：直接渲染连续位置 */
}
function up(){
  if(!dg) return;
  dg=false; stage.classList.remove('grabbing');
  if (horiz && Math.abs(mx)>10){
    var raw = base - mx/THRESH;
    /* 单次手势最多走一张，避免一拖飞过好几张 */
    var step = Math.max(-1, Math.min(1, Math.round(raw - base)));
    setPos(base + step);
  } else {
    setPos(base);                   /* 未达阈值：吸回原位 */
  }
  setTimeout(function(){ horiz=null; mx=0; }, 40);
}

stage.addEventListener('mousedown', down);
window.addEventListener('mousemove', move, {passive:false});
window.addEventListener('mouseup', up);
stage.addEventListener('touchstart', down, {passive:true});
stage.addEventListener('touchmove', move, {passive:false});
stage.addEventListener('touchend', up);

/* 点击：侧卡→居中；中心卡→跳转 */
cards.forEach(function(c,i){
  c.addEventListener('click', function(e){
    if (isMobile()) return;            /* 手机端：整卡即链接，直接放行 */
    if (horiz || Math.abs(mx)>7){ e.preventDefault(); return; }
    if (i!==cur){ e.preventDefault(); go(i); }
  });
  c.addEventListener('dragstart', function(e){ e.preventDefault(); });
});

dots.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(b) go(parseInt(b.dataset.i,10));
});
wPrev.addEventListener('click', function(){ go(cur-1); });
wNext.addEventListener('click', function(){ go(cur+1); });

/* 横向滚轮 / 触控板横扫：一次手势只翻一张 */
var wLast=0, wFired=false;
stage.addEventListener('wheel', function(e){
  if (isMobile()) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  var now = Date.now();
  /* 间隔超过 190ms 视为新手势，重新允许触发 */
  if (now - wLast > 190) wFired = false;
  wLast = now;
  if (wFired) return;              /* 同一次惯性滚动内只认第一下 */
  if (Math.abs(e.deltaX) < 6) return;
  wFired = true;
  go(cur + (e.deltaX>0 ? 1 : -1));
}, {passive:false});

setPos(0);

/* 视口跨越断点时重算布局 */
(function(){
  var wasM = isMobile();
  window.addEventListener('resize', function(){
    var m = isMobile();
    if (m !== wasM){ wasM = m; setPos(pos); }
    else if (!m){ place(pos); }
  });
})();

(function(){
  var card=document.getElementById('card'), wrap=card.parentNode;
  wrap.addEventListener('mousemove', function(e){
    var r=card.getBoundingClientRect();
    var dx=(e.clientX-(r.left+r.width/2))/r.width;
    var dy=(e.clientY-(r.top+r.height/2))/r.height;
    card.style.transform='perspective(1400px) rotateY('+(dx*3.6).toFixed(2)+'deg) rotateX('+(-dy*2.8).toFixed(2)+'deg)';
  });
  wrap.addEventListener('mouseleave', function(){ card.style.transform=''; });
})();

var scroller=document.getElementById('scroller');
var secs=[].slice.call(scroller.querySelectorAll('.sec'));
var nav=document.getElementById('nav'), progBar=document.getElementById('progBar');

(function(){
  var h='';
  secs.forEach(function(s,i){ h += '<button data-i="'+i+'">'+s.dataset.nav+'</button>'; });
  nav.innerHTML=h;
  nav.addEventListener('click', function(e){
    var b=e.target.closest('button');
    if (!b) return;
    var t=secs[parseInt(b.dataset.i,10)];
    if (t) scroller.scrollTo({top:t.offsetTop, behavior:'smooth'});
  });
})();

var lastTop=-1, lastVh=-1, curSec=-1;
function syncScroll(){
  var top=scroller.scrollTop, vh=scroller.clientHeight;
  if (top===lastTop && vh===lastVh) return;
  lastTop=top; lastVh=vh;

  /* 按各 section 真实位置判定，兼容手机端不等高布局 */
  var probe = top + vh*0.34, idx = 0;
  for (var i=0;i<secs.length;i++){
    if (secs[i].offsetTop <= probe) idx = i;
  }
  if (idx!==curSec){
    curSec=idx;
    secs.forEach(function(s,i){ s.classList.toggle('in', i<=idx); });
    [].slice.call(nav.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===idx); });
  }
  var max=Math.max(1, scroller.scrollHeight - vh);
  progBar.style.width=Math.min(100,(top/max)*100).toFixed(1)+'%';
}
(function loop(){ syncScroll(); requestAnimationFrame(loop); })();

window.addEventListener('keydown', function(e){
  if (Math.round(scroller.scrollTop/scroller.clientHeight)!==1) return;
  if (e.key==='ArrowRight'){ e.preventDefault(); go(cur+1); }
  if (e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
});
</script>
