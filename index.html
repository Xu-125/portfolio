<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐皓萱 Hazel Xu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a17'/%3E%3Cpath d='M16 17h9l7 11 7-11h9L36.5 35v13h-9V35z' fill='%23f7f5f1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap">
<style>
:root{
  --void:#f7f5f1;
  --ink:#1c1a17;
  --ink-2:rgba(28,26,23,.76);
  --ink-3:rgba(28,26,23,.54);
  --ink-4:rgba(28,26,23,.36);
  --hair:rgba(28,26,23,.14);
  --hair-2:rgba(28,26,23,.075);
  --gold:#a05a32;
  --gold-2:#8a4a28;
  --sky:#5b86b0;
  --serif:'Newsreader','Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Inter','Noto Sans SC',ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif;
  --bgimg:url('img/aura.jpg');
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);line-height:1.62;background:var(--void);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;background:none;border:0;cursor:pointer;color:inherit}
::selection{background:rgba(160,90,50,.16)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
svg{display:block}

/* 全站弥散光背景 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:var(--bgimg);background-size:cover;background-position:center;
  opacity:.88;
}
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(248,247,244,.12) 0%,transparent 30%,transparent 70%,rgba(248,247,244,.08) 100%);
}

.scroller{position:relative;z-index:3;height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.scroller::-webkit-scrollbar{width:0}
.sec{
  height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  padding:clamp(58px,7.4vh,92px) clamp(28px,5vw,96px) clamp(22px,3vh,42px);
}

/* 顶栏 */
.top{
  position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;justify-content:flex-end;
  padding:clamp(17px,2.2vh,26px) clamp(28px,5vw,96px);
}
.top .bd{font-family:var(--serif);font-size:15.5px;font-weight:400;letter-spacing:.01em}
.top .lang-switch{display:flex;align-items:center;gap:7px;margin-right:clamp(18px,2.4vw,38px);padding:4px 7px;border:1px solid var(--hair);border-radius:999px;background:rgba(247,245,241,.48);backdrop-filter:blur(10px)}
.top .lang-switch button{min-width:25px;padding:2px 5px;font-size:9.5px;font-weight:500;letter-spacing:.08em;color:var(--ink-4);border-radius:999px;transition:color .3s,background .3s}
.top .lang-switch button:hover{color:var(--ink)}
.top .lang-switch button.on{color:var(--void);background:var(--ink)}
.top .lang-switch .sep{font-size:8px;color:var(--ink-4);user-select:none}
.top nav{display:flex;gap:clamp(13px,1.8vw,28px)}
.top nav button{
  position:relative;padding:3px 1px;font-size:10.5px;font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-4);transition:color .4s;
}
.top nav button::after{
  content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .58s cubic-bezier(.19,1,.22,1);
}
.top nav button:hover{color:var(--ink-2)}
.top nav button.on{color:var(--ink)}
.top nav button.on::after{transform:scaleX(1)}

/* Ask Hazel · 基于本站内容的双语作品集助手 */
.ask-launcher{
  position:fixed;right:clamp(18px,2.8vw,42px);bottom:clamp(22px,3.2vh,38px);z-index:88;
  min-width:124px;min-height:44px;padding:11px 16px;border:1px solid rgba(28,26,23,.18);
  background:rgba(28,26,23,.94);color:var(--void);display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 14px 34px -16px rgba(28,26,23,.42);transition:transform .35s,background .35s;
}
.ask-launcher:hover{transform:translateY(-3px);background:var(--gold)}
.ask-launcher svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.ask-panel{
  position:fixed;right:clamp(18px,2.8vw,42px);bottom:clamp(76px,10vh,96px);z-index:89;
  width:min(390px,calc(100vw - 36px));height:min(610px,calc(100dvh - 116px));
  background:rgba(250,249,246,.97);border:1px solid var(--hair);box-shadow:0 30px 90px -35px rgba(28,26,23,.4);
  backdrop-filter:blur(18px);display:flex;flex-direction:column;
  opacity:0;transform:translateY(16px) scale(.985);pointer-events:none;transition:opacity .28s,transform .35s cubic-bezier(.19,1,.22,1);
}
.ask-panel.open{opacity:1;transform:none;pointer-events:auto}
.ask-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px;border-bottom:1px solid var(--hair-2)}
.ask-head .kicker{font-size:9px;font-weight:650;letter-spacing:.17em;text-transform:uppercase;color:var(--gold-2)}
.ask-head h2{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.05;margin-top:5px}
.ask-head p{font-size:10px;color:var(--ink-3);line-height:1.55;margin-top:6px;max-width:270px}
.ask-close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--hair);flex-shrink:0;transition:border-color .3s,color .3s}
.ask-close:hover{border-color:var(--gold);color:var(--gold-2)}
.ask-close svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.5}
.ask-messages{flex:1;min-height:0;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.ask-msg{max-width:88%;padding:11px 13px;font-size:12px;line-height:1.68;border:1px solid var(--hair-2);white-space:pre-line}
.ask-msg.bot{align-self:flex-start;background:#fff;color:var(--ink-2)}
.ask-msg.user{align-self:flex-end;background:var(--ink);border-color:var(--ink);color:var(--void)}
.ask-msg .jump{display:inline-flex;align-items:center;min-height:32px;margin-top:9px;padding:6px 10px;border:1px solid rgba(160,90,50,.28);color:var(--gold-2);font-size:9px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
.ask-msg .jump:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.ask-prompts{padding:0 20px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.ask-prompts::-webkit-scrollbar{display:none}
.ask-prompts button{flex:0 0 auto;min-height:36px;padding:7px 10px;border:1px solid var(--hair);background:rgba(255,255,255,.68);font-size:9px;color:var(--ink-2);transition:all .3s}
.ask-prompts button:hover{border-color:var(--gold);color:var(--gold-2)}
.ask-form{display:grid;grid-template-columns:1fr 46px;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--hair-2)}
.ask-form input{width:100%;min-width:0;height:44px;border:1px solid var(--hair);background:#fff;padding:0 12px;font-family:var(--sans);font-size:12px;color:var(--ink);outline:none}
.ask-form input:focus{border-color:var(--gold)}
.ask-form button{width:46px;height:44px;background:var(--ink);color:var(--void);display:flex;align-items:center;justify-content:center;transition:background .3s}
.ask-form button:hover{background:var(--gold)}
.ask-form button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.ask-note{padding:0 20px 14px;font-size:8.5px;color:var(--ink-4);line-height:1.45}

.prog{position:fixed;left:0;bottom:0;height:1px;width:100%;z-index:69;background:var(--hair-2)}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .24s linear}

.rise{opacity:0;transform:translateY(18px);transition:opacity .95s cubic-bezier(.19,1,.22,1),transform .95s cubic-bezier(.19,1,.22,1)}
.sec.in .rise{opacity:1;transform:none}
.sec.in .d1{transition-delay:.09s}
.sec.in .d2{transition-delay:.18s}
.sec.in .d3{transition-delay:.27s}

/* 板块标头：斜体衬线 + 长横线，非居中 */
.bh{display:flex;align-items:baseline;gap:clamp(11px,1.5vw,20px);flex-shrink:0}
.bh h2{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.4vw,22px);font-weight:400;letter-spacing:.005em;white-space:nowrap;color:var(--ink-2)}
.bh .rule{flex:1;height:1px;background:var(--hair);min-width:12px}
.bh .tag{font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap}

/* ============ 1 · 首页：非对称版面 ============ */
#s-home{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(0,.78fr);
  grid-template-rows:auto minmax(0,1fr);
  column-gap:clamp(26px,4vw,74px);row-gap:clamp(12px,1.8vh,24px);
  padding-top:clamp(54px,6.7vh,78px);
}
#s-home .lead .ttl{font-size:clamp(44px,5.5vw,84px)}
#s-home .side .pf img{max-height:29vh}
#s-home .caps{gap:clamp(8px,1.15vh,15px)}
#s-home .capC .v{font-size:clamp(24px,2.3vw,39px)}
/* 左上：姓名 + 学历，错落排布 */
.lead{grid-column:1;grid-row:1;min-width:0}
.lead .eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2);margin-bottom:clamp(8px,1.2vh,14px)}
.lead .ttl{font-family:var(--serif);font-size:clamp(48px,7vw,112px);font-weight:400;letter-spacing:-.045em;line-height:.88}
.lead .ttl em{font-style:normal;font-weight:300}
.lead .sub{margin-top:clamp(12px,1.9vh,22px);display:flex;align-items:center;gap:clamp(11px,1.5vw,20px);flex-wrap:wrap}
.lead .sub .lat{font-size:10.5px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.lead .sub .bar{width:clamp(18px,2.4vw,40px);height:1px;background:var(--hair)}
.lead .sub .rl{font-family:var(--serif);font-style:italic;font-size:13px;font-weight:400;color:var(--ink-2)}
.lead .position{margin-top:clamp(16px,2vh,26px);max-width:680px;font-family:var(--serif);font-size:clamp(19px,2.1vw,32px);line-height:1.18;letter-spacing:-.025em}
.lead .promise{margin-top:10px;max-width:630px;font-size:clamp(11px,.95vw,14px);line-height:1.72;color:var(--ink-3)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(14px,2vh,24px)}
.hero-actions a,.hero-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 16px;border:1px solid var(--hair);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:all .35s}
.hero-actions .primary{background:var(--ink);border-color:var(--ink);color:var(--void)}
.hero-actions a:hover,.hero-actions button:hover{border-color:var(--gold);color:var(--gold-2);transform:translateY(-2px)}
.hero-actions .primary:hover{background:var(--gold);border-color:var(--gold);color:#fff}

/* 学历：紧跟姓名，缩进对齐 */
.edu{margin-top:clamp(14px,2vh,26px);display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);max-width:min(100%,640px)}
.edu .e{display:flex;align-items:baseline;gap:clamp(10px,1.3vw,18px);position:relative;padding-left:clamp(13px,1.5vw,22px);transition:padding-left .58s cubic-bezier(.19,1,.22,1)}
.edu .e::before{
  content:'';position:absolute;left:0;top:.62em;width:clamp(6px,.7vw,11px);height:1px;background:var(--ink-4);
  transition:width .58s cubic-bezier(.19,1,.22,1),background .4s;
}
.edu .e:hover{padding-left:clamp(20px,2.2vw,32px)}
.edu .e:hover::before{width:clamp(13px,1.4vw,21px);background:var(--gold)}
.edu .e b{font-family:var(--serif);font-size:clamp(16px,1.5vw,24px);font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.edu .e s{text-decoration:none;font-size:clamp(10px,.82vw,12px);color:var(--ink-3);font-weight:400}
.edu .e u{text-decoration:none;font-size:10px;font-weight:400;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap;transition:color .4s}
.edu .e:hover u{color:var(--gold-2)}

/* 右上：肖像 + 能力叠加，不是并排卡片 */
.side{grid-column:2;grid-row:1;min-width:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:clamp(14px,1.8vw,30px)}
.side .pf{position:relative;width:min(100%,clamp(150px,17vw,250px));flex-shrink:0}
.side .pf img{width:100%;height:auto;max-height:34vh;object-fit:contain;object-position:bottom right;
  filter:none contrast(1.02) drop-shadow(0 14px 32px rgba(28,26,23,.1))}
/* 能力：错落列，非等分格 */
.caps{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(11px,1.7vh,22px);padding-top:clamp(4px,.8vh,12px)}
.capC{cursor:default;transition:transform .5s cubic-bezier(.19,1,.22,1)}
.capC:nth-child(2){margin-left:clamp(9px,1.3vw,22px)}
.capC:nth-child(3){margin-left:clamp(18px,2.6vw,44px)}
.capC:hover{transform:translateX(4px)}
.capC .v{font-family:var(--serif);font-size:clamp(26px,2.8vw,46px);font-weight:400;letter-spacing:-.04em;line-height:1;color:var(--gold);transition:color .45s}
.capC:hover .v{color:var(--gold-2)}
.capC .lb{font-size:10.5px;font-weight:500;margin-top:6px;color:var(--ink)}
.capC .sb{font-size:9px;font-weight:400;color:var(--ink-4);margin-top:2px;line-height:1.5}

/* 实习经历：横向时间坐标轴，可拖动 */
.xp{grid-column:1 / -1;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,18px)}

.axwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
/* 拖动视口 */
.axview{
  flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;
  cursor:grab;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
.axview::-webkit-scrollbar{height:0}
.axview.grabbing{cursor:grabbing}
.axview.grabbing .xc{pointer-events:none}
.axview.grabbing,.axview.grabbing *{user-select:none;-webkit-user-select:none}

/* 轨道：内容宽度由卡片决定 */
.axrail{
  position:relative;height:100%;display:flex;align-items:stretch;
  padding:clamp(26px,3.6vh,44px) clamp(6px,1vw,16px) 0;
  min-width:max-content;
}
/* 坐标轴基线 */
.axrail::before{
  content:'';position:absolute;left:0;right:0;top:clamp(26px,3.6vh,44px);height:1px;
  background:linear-gradient(90deg,var(--hair) 0%,var(--hair) 88%,transparent 100%);
}

/* 单个经历节点 */
.xc{
  position:relative;flex:0 0 clamp(252px,21vw,318px);
  display:flex;flex-direction:column;
  padding:0 clamp(15px,1.5vw,24px) clamp(12px,1.7vh,20px);
  transition:background .5s cubic-bezier(.19,1,.22,1);
}
.xc + .xc{border-left:1px solid var(--hair-2)}
.xc .inner{padding-top:clamp(17px,2.4vh,28px);padding-bottom:clamp(4px,.8vh,10px);display:flex;flex-direction:column}
/* 轴点：坐落在轨道基线上 */
.xc::before{
  content:'';position:absolute;left:clamp(15px,1.5vw,24px);top:0;
  width:7px;height:7px;border-radius:50%;
  background:var(--void);border:1px solid var(--ink-4);
  transform:translateY(-50%);z-index:2;
  transition:all .5s cubic-bezier(.19,1,.22,1);
}
.xc:hover::before{border-color:var(--gold);background:var(--gold);transform:translateY(-50%) scale(1.3)}
.xc.now::before{border-color:var(--gold);background:var(--gold);width:9px;height:9px;box-shadow:0 0 0 4px rgba(160,90,50,.13)}
.xc:hover{background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 74%)}
.xc.now{background:linear-gradient(180deg,rgba(160,90,50,.055),transparent 72%)}

.xc .wn{font-size:9.5px;font-weight:500;letter-spacing:.08em;color:var(--ink-3)}
.xc.now .wn{color:var(--gold-2)}
.xc .og{font-family:var(--serif);font-size:clamp(15px,1.42vw,22px);font-weight:500;letter-spacing:-.022em;line-height:1.28;margin-top:9px}
.xc.now .og{font-size:clamp(16px,1.6vw,25px)}
.xc .rl{font-size:9.5px;font-weight:400;color:var(--ink-3);margin-top:6px;line-height:1.5}
.xc .kn{margin-top:clamp(13px,2.1vh,26px)}
.xc .kn .kv{font-family:var(--serif);font-size:clamp(27px,2.9vw,44px);font-weight:400;letter-spacing:-.042em;line-height:1;color:var(--gold);transition:color .5s}
.xc.now .kn .kv{font-size:clamp(31px,3.4vw,54px)}
.xc .kn .kk{font-size:9px;font-weight:400;color:var(--ink-2);margin-top:7px;line-height:1.5}
.xc .more{margin-top:clamp(15px,2.2vh,26px);padding-top:clamp(9px,1.3vh,14px);border-top:1px solid var(--hair-2);display:flex;flex-direction:column;gap:5px}
.xc .more i{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-4);display:flex;gap:7px;line-height:1.5}
.xc .more i b{font-weight:500;color:var(--ink-2);flex-shrink:0}

/* 拖动提示 */
.axhint{
  flex-shrink:0;display:flex;align-items:center;gap:10px;margin-top:clamp(6px,.9vh,11px);
  font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
}
.axhint .ln{flex:1;height:1px;background:var(--hair-2);position:relative;overflow:hidden}
.axhint .ln i{position:absolute;left:0;top:0;height:100%;background:var(--gold);width:0;transition:width .22s linear}
.axhint svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}

@media(max-width:1180px){
  #s-home{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
  .xpg{grid-template-columns:1.4fr 1fr 1fr;overflow-y:auto}
  .xc:nth-child(4){border-left:0}
}
@media(max-width:800px){
  #s-home{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .lead{grid-row:1}
  .side{grid-column:1;grid-row:2;max-height:20vh;align-items:flex-end}
  .side .pf{width:clamp(96px,26vw,140px)}
  .side .pf img{max-height:20vh}
  .caps{max-width:60%}
  .xp{grid-column:1;grid-row:3}
  .lead .ttl{font-size:clamp(34px,10vw,54px)}
  .xpg{grid-template-columns:1.3fr 1fr}
  .xc:nth-child(3){border-left:0}
  .xc .more{display:none}
}

/* ============ 2 · 作品：3D 立体卡 ============ */
#s-work{display:flex;flex-direction:column;gap:clamp(8px,1.15vh,14px)}
.ai-os{display:flex;align-items:center;gap:clamp(8px,1vw,14px);flex-wrap:wrap;padding:9px 0 11px;border-bottom:1px solid var(--hair-2)}
.ai-os .os-label{font-size:9px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);margin-right:5px}
.ai-os .os-step{display:inline-flex;align-items:center;gap:8px;font-size:9.5px;color:var(--ink-3)}
.ai-os .os-step:not(:last-child)::after{content:'→';color:var(--gold);font-family:var(--serif);font-size:13px}
.wwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,16px)}

.stage{
  flex:1;min-height:0;position:relative;
  perspective:2000px;perspective-origin:50% 50%;
  cursor:grab;touch-action:pan-y;
}
.stage.grabbing{cursor:grabbing}
.stage.grabbing .fc{transition:none!important}
.track{position:absolute;inset:0;transform-style:preserve-3d}

/* 卡片：中心卡是主角，够大够清楚 */
.fc{
  position:absolute;left:50%;top:50%;
  width:clamp(300px,27vw,410px);height:min(88%,520px);
  margin-left:calc(clamp(300px,27vw,410px) / -2);
  margin-top:calc(min(88%,520px) / -2);
  transform-style:preserve-3d;
  transition:transform .78s cubic-bezier(.19,1,.22,1),opacity .5s,filter .5s;
  will-change:transform,opacity;
  display:block;
}
.fc .face{
  position:absolute;inset:0;overflow:hidden;border-radius:16px;
  background:#fff;border:1px solid var(--hair-2);
  display:flex;flex-direction:column;
  transition:box-shadow .6s,border-color .6s;
}
/* 中心卡：厚重投影托起立体感 */
.fc.on .face{
  border-color:var(--hair);
  box-shadow:
    0 42px 84px -30px rgba(28,26,23,.3),
    0 14px 30px -14px rgba(28,26,23,.14),
    0 2px 6px rgba(28,26,23,.05);
}
.fc.on:hover .face{
  border-color:rgba(160,90,50,.44);
  box-shadow:
    0 52px 100px -32px rgba(28,26,23,.34),
    0 16px 34px -14px rgba(28,26,23,.16),
    0 2px 6px rgba(28,26,23,.05);
}
/* 侧卡：弱化，只作景深 */
.fc:not(.on) .face{box-shadow:0 20px 44px -22px rgba(28,26,23,.16)}

/* 封面 */
.fc .shot{position:relative;width:100%;flex:0 0 50%;overflow:hidden;background:#f1efeb}
.fc .shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.19,1,.22,1)}
.fc.on:hover .shot img{transform:scale(1.045)}
.fc .shot::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 58%,rgba(255,255,255,.16));
}
.fc .idx{
  position:absolute;top:14px;left:16px;z-index:3;
  font-family:var(--serif);font-size:11.5px;font-weight:500;letter-spacing:.13em;color:#fff;
  text-shadow:0 1px 9px rgba(0,0,0,.55);
}
/* hover 才浮现的打开徽标 */
.fc .peek{
  position:absolute;top:12px;right:14px;z-index:4;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;
  background:rgba(255,255,255,.95);
  font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  opacity:0;transform:translateY(-5px);
  transition:opacity .4s cubic-bezier(.19,1,.22,1),transform .4s cubic-bezier(.19,1,.22,1);
}
.fc.on:hover .peek{opacity:1;transform:none}
.fc .peek svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2}

/* 信息区 */
.fc .meta{
  padding:clamp(13px,1.5vw,21px) clamp(15px,1.7vw,24px) clamp(12px,1.5vh,17px);
  display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;
}
.fc .og{font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.fc h3{
  font-family:var(--serif);font-size:clamp(17px,1.66vw,25px);font-weight:500;
  letter-spacing:-.026em;line-height:1.3;margin-top:8px;color:var(--ink);
}
.fc .case-story{margin-top:9px;padding-top:8px;border-top:1px solid var(--hair-2);font-size:9px;line-height:1.58;color:var(--ink-3)}
.fc .case-story b{font-weight:650;color:var(--gold-2);margin-right:5px}
/* 主数字 */
.fc .bg{margin-top:clamp(11px,1.6vh,18px);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fc .bg .v{
  font-family:var(--serif);font-size:clamp(30px,3vw,46px);font-weight:400;
  line-height:.96;letter-spacing:-.048em;color:var(--gold);
}
.fc .bg .k{font-size:9px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
/* 次级数据：只列 2 条，不堆 */
.fc .rows{margin-top:clamp(10px,1.5vh,15px);display:flex;flex-direction:column}
.fc .rows i{
  font-style:normal;display:flex;align-items:baseline;gap:10px;
  padding:clamp(5px,.75vh,8px) 0;border-top:1px solid var(--hair-2);
  font-size:9px;font-weight:400;color:var(--ink-4);line-height:1.5;
}
.fc .rows i b{
  font-family:var(--serif);font-size:13.5px;font-weight:500;color:var(--ink-2);
  flex-shrink:0;min-width:72px;letter-spacing:-.028em;
}
/* 底部跳转条 */
.fc .open{
  margin-top:auto;padding-top:clamp(11px,1.5vh,16px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--hair-2);
}
.fc .open span{
  font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-2);transition:letter-spacing .45s;
}
.fc .open .ic{
  width:29px;height:29px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(160,90,50,.34);display:flex;align-items:center;justify-content:center;
  color:var(--gold-2);transition:all .45s cubic-bezier(.19,1,.22,1);
}
.fc .open .ic svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.fc.on:hover .open span{letter-spacing:.23em}
.fc.on:hover .open .ic{background:var(--gold);border-color:var(--gold);color:#fff;transform:scale(1.12) rotate(45deg)}

/* 左右点击热区：侧卡即按钮 */
.fc:not(.on){cursor:pointer}

/* ---------- 底部：缩略进度 + 箭头 ---------- */
.wfoot{
  flex-shrink:0;display:flex;align-items:center;gap:clamp(12px,1.7vw,26px);
  border-top:1px solid var(--hair-2);padding-top:clamp(10px,1.4vh,15px);
}
.wnow{min-width:0;flex:1}
.wnow .l1{font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.wnow .l2{
  font-family:var(--serif);font-size:clamp(14px,1.32vw,20px);font-weight:500;
  letter-spacing:-.026em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 圆点进度：清楚显示位置 */
.dotrow{display:flex;gap:7px;flex-shrink:0;align-items:center}
.dotrow button{
  width:6px;height:6px;border-radius:50%;background:var(--hair);
  transition:all .5s cubic-bezier(.19,1,.22,1);
}
.dotrow button:hover{background:var(--ink-3);transform:scale(1.3)}
.dotrow button.on{width:22px;border-radius:3px;background:var(--gold)}
.wnav{display:flex;align-items:center;gap:clamp(10px,1.3vw,17px);flex-shrink:0}
.wnav .cnt{font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--ink-4)}
.wnav .cnt b{color:var(--ink);font-weight:500}
.wnav button.ar{
  width:clamp(33px,2.9vw,39px);height:clamp(33px,2.9vw,39px);border-radius:50%;
  border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:all .4s cubic-bezier(.19,1,.22,1);
}
.wnav button.ar svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.wnav button.ar:hover:not(:disabled){border-color:var(--gold);color:var(--gold);transform:scale(1.08)}
.wnav button.ar:disabled{opacity:.18}

/* 拖动提示 */
.whint{
  position:absolute;left:50%;bottom:clamp(1px,.4vh,6px);transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;z-index:50;pointer-events:none;
  font-size:8.5px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-4);
  opacity:.7;transition:opacity .55s;
}
.whint.hide{opacity:0}
.whint svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}

@media(max-width:900px){
  .fc{width:clamp(258px,74vw,330px);height:min(92%,500px);
    margin-left:calc(clamp(258px,74vw,330px) / -2);margin-top:calc(min(92%,500px) / -2)}
  .fc .rows{display:none}
}

/* ============ 3 · 名片 ============ */
#s-card{display:flex;flex-direction:column;gap:clamp(11px,1.7vh,24px)}
.cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:clamp(10px,2vh,30px)}
.card{
  position:relative;width:min(100%,clamp(340px,52vw,700px));
  background:#ffffff;
  border:1px solid var(--hair-2);border-radius:14px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,.36fr) minmax(0,1fr);
  box-shadow:0 20px 48px -20px rgba(28,26,23,.1),0 1px 4px rgba(28,26,23,.04);
  transition:transform .7s cubic-bezier(.19,1,.22,1),box-shadow .7s;
}
.card .cl{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border-right:1px solid var(--hair-2)}
.card .cl::before{content:'';position:absolute;inset:0;background:radial-gradient(closest-side at 50% 100%,rgba(160,90,50,.07),transparent 76%)}
.card .cl img{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:saturate(.96) contrast(1.02)}
.card .cr{padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;min-width:0}
.card .nm{font-family:var(--serif);font-size:clamp(26px,2.8vw,42px);font-weight:300;letter-spacing:-.038em;line-height:1.04}
.card .lt{font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.card .rl{
  margin-top:clamp(14px,2vh,22px);padding-top:clamp(14px,2vh,22px);border-top:1px solid var(--hair-2);
  font-family:var(--serif);font-size:clamp(12px,1vw,14.5px);font-weight:400;line-height:1.72;
}
.card .rl em{font-style:italic;display:block;color:var(--ink-3);margin-top:6px}
.card .iv{margin-top:clamp(13px,1.8vh,20px)}
.card .iv .il{font-size:9px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4)}
.card .iv .ic{margin-top:10px;display:flex;flex-wrap:wrap;gap:clamp(9px,1.2vw,18px)}
.card .iv .ic span{font-size:10.5px;font-weight:400;color:var(--ink-2);position:relative;transition:color .4s}
.card .iv .ic span::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .5s cubic-bezier(.19,1,.22,1)}
.card .iv .ic span:hover{color:var(--gold-2)}
.card .iv .ic span:hover::after{transform:scaleX(1)}
.card .cx{margin-top:auto;padding-top:clamp(16px,2.2vh,26px);display:flex;flex-wrap:wrap;gap:clamp(11px,1.5vw,22px)}
.card .cx a,.card .cx span{
  display:inline-flex;align-items:center;gap:9px;font-size:10.5px;font-weight:400;letter-spacing:.02em;
  padding-bottom:6px;border-bottom:1px solid var(--hair);transition:all .42s;
}
.card .cx a:hover{color:var(--gold-2);border-bottom-color:var(--gold)}
.card .cx span{color:var(--ink-4)}
.card .cx svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.4}
@media(max-width:760px){
  .card{grid-template-columns:1fr}
  .card .cl{max-height:17vh;border-right:0;border-bottom:1px solid var(--hair-2)}
  .card .cl img{max-height:17vh;width:auto}
}

/* ══════════════ 手机端：首页撑开，作品保留 3D 转盘与拖动 ══════════════ */
@media(max-width:760px){
  /* 页面整体：关掉整屏吸附（首页放不下），但各屏仍至少占满一屏 */
  .scroller{scroll-snap-type:none;height:100dvh;-webkit-overflow-scrolling:touch}
  .sec{
    height:auto;min-height:100dvh;scroll-snap-align:none;overflow:hidden;
    padding:clamp(66px,15vw,86px) clamp(18px,5vw,26px) clamp(24px,6vw,36px);
  }
  .sec + .sec{border-top:1px solid var(--hair-2)}
  .rise{transform:translateY(12px)}

  .top{padding:14px clamp(18px,5vw,26px)}
  .top .lang-switch{margin-right:12px;gap:4px;padding:3px 5px}
  .top .lang-switch button{min-width:23px;font-size:8.5px;padding:2px 4px}
  .top nav{gap:15px}
  .top nav button{font-size:9.5px;letter-spacing:.13em}
  .ask-launcher{right:16px;bottom:18px;min-width:112px;min-height:44px;padding:10px 13px}
  .ask-panel{right:10px;bottom:72px;width:calc(100vw - 20px);height:min(650px,calc(100dvh - 90px))}
  .ask-head{padding:17px}
  .ask-head h2{font-size:22px}
  .ask-messages{padding:15px 17px}
  .ask-prompts{padding:0 17px 11px}
  .ask-form{padding:11px 17px 15px}
  .ask-note{padding:0 17px 12px}

  /* ---------- 首页：允许超出一屏，内容不再被压 ---------- */
  #s-home{
    display:flex;flex-direction:column;gap:clamp(20px,5vw,30px);
    height:auto;overflow:visible;
  }
  .lead .ttl{font-size:clamp(42px,13vw,64px);line-height:.92}
  .lead .eyebrow{margin-bottom:9px}
  .lead .sub{margin-top:10px}
  .lead .position{font-size:clamp(22px,6.6vw,32px);margin-top:18px}
  .lead .promise{font-size:12px;margin-top:10px}
  .hero-actions{margin-top:16px}
  .hero-actions a,.hero-actions button{min-height:42px;font-size:9px;padding:9px 13px}
  .edu{margin-top:clamp(18px,4vw,24px);max-width:100%;gap:11px}
  .edu .e{flex-wrap:wrap;gap:4px 10px}
  .edu .e b{font-size:clamp(16px,4.6vw,20px)}
  .edu .e s{font-size:11px}
  .edu .e u{font-size:10px;flex-basis:100%}

  .side{
    grid-column:auto;grid-row:auto;max-height:none;
    flex-direction:row;align-items:flex-end;justify-content:space-between;
    gap:clamp(14px,4vw,22px);
  }
  .side .pf{width:clamp(112px,34vw,168px)}
  .side .pf img{max-height:none;width:100%}
  .caps{max-width:none;flex:1;display:flex;flex-direction:column;gap:clamp(13px,3.4vw,20px)}
  .capC .v{font-size:clamp(26px,8vw,38px)}
  .capC .lb{font-size:11px}
  .capC .sb{font-size:9.5px}

  /* ---------- 实习经历：保留横向拖动坐标轴 ---------- */
  .xp{grid-column:auto;grid-row:auto;gap:clamp(13px,3.4vw,18px);height:auto}
  .axwrap{flex:none;height:auto}
  .axview{
    overflow-x:auto;overflow-y:hidden;cursor:grab;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    height:auto;
  }
  .axrail{padding-top:clamp(22px,5.5vw,30px);height:auto;align-items:stretch}
  /* 卡片收窄，一屏露出一张半，暗示可拖 */
  .xc{flex:0 0 clamp(210px,62vw,250px)}
  .xc .inner{padding-top:clamp(13px,3.4vw,18px);padding-bottom:clamp(4px,1vw,8px)}
  .xc .og{font-size:clamp(16px,4.6vw,19px)}
  .xc.now .og{font-size:clamp(17px,5vw,21px)}
  .xc .rl{font-size:10px}
  .xc .kn{margin-top:clamp(9px,2.4vw,13px)}
  .xc .kn .kv{font-size:clamp(26px,7.6vw,34px)}
  .xc.now .kn .kv{font-size:clamp(28px,8.2vw,37px)}
  .xc .kn .kk{font-size:9.5px}
  .xc .more{display:flex!important;margin-top:clamp(11px,2.8vw,15px);gap:4px}
  .xc .more i{font-size:9.5px}
  .xc .more i b{min-width:64px;font-size:12.5px}
  .axhint{display:flex}

  /* ---------- 作品：保留 3D 转盘 + 拖动翻卡 ---------- */
  #s-work{
    display:flex;flex-direction:column;gap:clamp(10px,2.5vw,15px);
    height:auto;min-height:100dvh;overflow:hidden;
  }
  .ai-os{gap:7px 10px;padding:8px 0 10px}
  .ai-os .os-label{flex-basis:100%}
  .ai-os .os-step{font-size:8.5px}
  .wwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(11px,2.8vw,16px)}
  .stage{
    flex:1;min-height:min(64dvh,470px);position:relative;
    perspective:1250px;perspective-origin:50% 48%;
    cursor:grab;
    touch-action:pan-y;        /* 竖向留给翻屏，横向由脚本接管 */
  }
  .track{position:absolute;inset:0;transform-style:preserve-3d}

  /* 卡片按屏宽定尺寸，中心卡完整可读 */
  .fc{
    position:absolute;left:50%;top:50%;
    width:min(78vw,300px);height:min(100%,438px);
    margin-left:calc(min(78vw,300px) / -2);
    margin-top:calc(min(100%,438px) / -2);
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.19,1,.22,1),opacity .45s,filter .45s;
  }
  .fc .face{position:absolute;inset:0;border-radius:14px}
  .fc.on .face{
    box-shadow:0 26px 56px -24px rgba(28,26,23,.26),
               0 8px 20px -10px rgba(28,26,23,.12);
  }
  .fc:not(.on) .face{box-shadow:0 14px 32px -18px rgba(28,26,23,.15)}
  .fc .shot{flex:0 0 47%}
  .fc .idx{top:11px;left:12px;font-size:10.5px}
  /* 触屏无 hover：徽标常显，提示可点开 */
  .fc.on .peek{opacity:1;transform:none}
  .fc .peek{top:10px;right:11px;padding:6px 11px;font-size:8.5px}
  .fc .meta{padding:clamp(13px,3.4vw,17px) clamp(14px,3.6vw,18px) clamp(12px,3vw,15px)}
  .fc h3{font-size:clamp(16px,4.6vw,19px)}
  .fc .case-story{font-size:9.5px;line-height:1.55;margin-top:8px;padding-top:7px}
  .fc .bg{margin-top:clamp(9px,2.4vw,13px)}
  .fc .bg .v{font-size:clamp(28px,8.4vw,38px)}
  .fc .bg .k{font-size:8.5px}
  /* 窄屏只留一条次级数据，保证底部跳转条不被挤掉 */
  .fc .rows{display:flex;margin-top:clamp(8px,2vw,11px)}
  .fc .rows i:nth-child(n+2){display:none}
  .fc .rows i{font-size:9.5px;padding:5px 0}
  .fc .rows i b{font-size:13px;min-width:70px}
  .fc .open{margin-top:auto;padding-top:clamp(10px,2.6vw,14px)}
  .fc .open span{font-size:9px;letter-spacing:.13em}
  .fc .open .ic{width:28px;height:28px}

  /* 底部：进度点 + 箭头保留，标题换行显示 */
  .wfoot{display:flex;flex-wrap:wrap;gap:9px clamp(10px,3vw,16px);padding-top:clamp(9px,2.4vw,13px)}
  .wnow{flex:1 1 100%;order:1}
  .wnow .l1{font-size:8px}
  .wnow .l2{font-size:clamp(14px,4.2vw,17px);white-space:normal}
  .dotrow{order:2;flex:1;gap:6px}
  .wnav{order:3;gap:11px}
  .wnav .cnt{font-size:11px}
  .wnav button.ar{width:32px;height:32px}
  .whint{display:flex;bottom:2px;font-size:8px;letter-spacing:.13em}

  /* ---------- 名片 ---------- */
  #s-card{justify-content:center;height:auto;min-height:100dvh}
  .card{grid-template-columns:1fr;border-radius:14px}
  .card .cl{max-height:none;border-right:0;border-bottom:1px solid var(--hair-2);padding:clamp(18px,4.6vw,24px)}
  .card .cl img{max-height:none;width:clamp(112px,34vw,150px)}
  .card .cr{padding:clamp(18px,4.6vw,24px)}
  .card .cx{flex-direction:column;align-items:flex-start;gap:12px}
  .card .cx a{font-size:11.5px}
}

/* 超窄屏（≤360px）再收一档 */
@media(max-width:360px){
  .lead .ttl{font-size:clamp(36px,12.5vw,44px)}
  .side{flex-direction:column;align-items:flex-start;gap:16px}
  .side .pf{width:clamp(100px,40vw,132px)}
  .caps{width:100%}
  .top nav{gap:11px}
  .top nav button{font-size:9px;letter-spacing:.1em}
  .fc{
    width:min(84vw,270px);height:min(100%,404px);
    margin-left:calc(min(84vw,270px) / -2);
    margin-top:calc(min(100%,404px) / -2);
  }
  .xc{flex:0 0 clamp(196px,68vw,226px)}
}

/* 横屏手机：高度紧张，压缩留白并缩小卡片 */
@media(max-width:900px) and (max-height:520px) and (orientation:landscape){
  .sec{padding-top:clamp(50px,11vh,64px);padding-bottom:clamp(16px,4vh,26px)}
  .lead .ttl{font-size:clamp(32px,7vw,44px)}
  .side .pf{width:clamp(84px,13vw,112px)}
  .stage{min-height:min(72dvh,320px)}
  .fc{
    width:min(46vw,268px);height:min(100%,296px);

/* 实习时间轴：拖动 + 进度条 */
(function(){
  var view=document.getElementById('axView'), bar=document.getElementById('axBar'), guide=document.getElementById('xpGuide');
  if(!view) return;
  var down=false, sx=0, sl=0, target=0, raf=0, guideUsed=false;
  function markGuideUsed(){
    if(guideUsed||!guide)return; guideUsed=true; guide.classList.add('used');
    var txt=guide.querySelector('[data-i18n]');
    if(txt) txt.textContent=currentLang==='en'?'Drag again to continue exploring':'已拖动，可继续浏览';
  }
  var RATE=1.35;   /* 位移放大，小幅拖动也有明显响应 */

  function apply(){
    raf=0;
    var max=view.scrollWidth-view.clientWidth;
    view.scrollLeft = Math.max(0, Math.min(max, target));
  }

  view.addEventListener('pointerdown', function(e){
    if (e.pointerType==='mouse' && e.button!==0) return;
    down=true; sx=e.clientX; sl=view.scrollLeft; target=sl;
    view.classList.add('grabbing');
    try{ view.setPointerCapture(e.pointerId); }catch(err){}
    if (e.pointerType==='mouse') e.preventDefault();
  });
  view.addEventListener('pointermove', function(e){
    if(!down) return;
    e.preventDefault();
    target = sl - (e.clientX - sx) * RATE;
    if(Math.abs(e.clientX-sx)>6) markGuideUsed();
    if(!raf) raf=requestAnimationFrame(apply);   /* 每帧只写一次 */
  });
  function end(e){
    if(!down) return;
    down=false; view.classList.remove('grabbing');
    try{ view.releasePointerCapture(e.pointerId); }catch(err){}
  }
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  view.addEventListener('dragstart', function(e){ e.preventDefault(); });

  /* 竖向滚轮转横向，让触控板也能推 */
  view.addEventListener('wheel', function(e){
    var maxSL = view.scrollWidth - view.clientWidth;
    if (maxSL <= 1) return;
    var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    var next = view.scrollLeft + dx;
    if ((next <= 0 && dx < 0) || (next >= maxSL && dx > 0)) return;
    e.preventDefault();
    view.scrollLeft = next;
    markGuideUsed();
  }, {passive:false});

  function syncBar(){
    var maxSL = view.scrollWidth - view.clientWidth;
    var pct = maxSL > 1 ? (view.scrollLeft / maxSL) : 0;
    if (bar) bar.style.width = (Math.min(1,Math.max(0,pct))*100).toFixed(1)+'%';
    /* 最靠近视口左缘的卡片高亮为 now */
    var xs=[].slice.call(view.querySelectorAll('.xc'));
    var vr=view.getBoundingClientRect(), best=0, bestD=1e9;
    xs.forEach(function(c,i){
      var r=c.getBoundingClientRect();
      var d=Math.abs(r.left - vr.left);
      if (d < bestD){ bestD=d; best=i; }
    });
    xs.forEach(function(c,i){ c.classList.toggle('now', i===best); });
  }
  view.addEventListener('scroll', syncBar);
  window.addEventListener('resize', syncBar);
  syncBar();
})();

/* 3D 参数：侧卡只露窄边，不遮挡中心 */
var GAP  = 0.86;   // 相邻卡水平偏移（卡宽倍数）
var DEEP = 340;    // 每层后退深度
var TILT = 34;     // 侧卡 Y 轴旋转角
var VIS  = 2;      // 每侧可见层数

var isMobile = function(){ return window.matchMedia('(max-width:760px)').matches; };

function place(f){
  var n = cards.length;
  var cw = cards.length ? cards[0].offsetWidth : 380;
  /* 把连续位置折进 0..n，保证 pos 长期累加也不失真 */
  var fm = ((f % n) + n) % n;
  cards.forEach(function(c,i){
    var off = i - fm;
    if (off >  n/2) off -= n;
    if (off < -n/2) off += n;
    var ab = Math.abs(off);
    if (ab > VIS + .6){
      c.style.opacity='0'; c.style.pointerEvents='none';
      c.style.transform='translateZ(-1100px) scale(.5)';
      c.classList.remove('on');
      return;
    }
    var x  = off * cw * GAP;
    var z  = -ab * DEEP;
    var ry = -Math.max(-1,Math.min(1,off)) * TILT * Math.min(1,ab);
    var sc = Math.max(.62, 1 - ab*0.1);
    c.style.opacity = String(Math.max(.12, 1 - ab*0.55));
    c.style.filter  = ab < .45 ? 'none' : 'blur('+Math.min(2.6, ab*1.15).toFixed(2)+'px)';
    c.style.zIndex  = String(50 - Math.round(ab*10));
    c.style.pointerEvents = 'auto';
    c.style.transform =
      'translateX('+x.toFixed(1)+'px) translateZ('+z.toFixed(1)+'px) '
      + 'rotateY('+ry.toFixed(2)+'deg) scale('+sc.toFixed(3)+')';
    c.classList.toggle('on', ab < .45);
  });
}
function sync(){
  [].slice.call(dots.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===cur); });
  var data=currentLang==='en'?WORK_EN:WORK;
  var it=data[cur];
  wOrg.textContent=it.org; wTitle.textContent=it.t;
  wCnt.innerHTML='<b>'+(cur+1<10?'0'+(cur+1):cur+1)+'</b> / '+cards.length;
}

function layout(){ place(pos); sync(); }

/* pos 为连续位置（可超出 0..n-1），cur 为其取模结果 —— 两者始终同坐标系 */
function setPos(p){
  pos = p;
  var n = cards.length;
  cur = ((Math.round(p) % n) + n) % n;
  layout();
}
function go(i){
  var n = cards.length;
  i = ((i % n) + n) % n;
  if (i === cur) return;
  /* 取到目标的最短环形增量，保证只走最近的那条路 */
  var d = i - cur;
  if (d >  n/2) d -= n;
  if (d < -n/2) d += n;
  setPos(pos + d);
}

/* ---- 拖动跟手 ---- */
var dg=false, sx=0, sy=0, mx=0, my=0, base=0, horiz=null;
var THRESH = matchMedia('(max-width:760px)').matches ? 118 : 200;
window.addEventListener('resize', function(){
  THRESH = matchMedia('(max-width:760px)').matches ? 118 : 200;
});

function down(e){
  if (e.button!==undefined && e.button!==0) return;
  dg=true; horiz=null; mx=0; my=0; base=pos;
  var t0 = e.touches && e.touches.length ? e.touches[0] : e;
  sx = t0.clientX; sy = t0.clientY;
  stage.classList.add('grabbing');
  if (wHint) wHint.classList.add('hide');
}
function move(e){
  if(!dg) return;
  var t = e.touches && e.touches.length ? e.touches[0] : e;
  var x = t.clientX, y = t.clientY;
  mx = x-sx; my = y-sy;
  /* 方向一经判定就锁定，不再随手指抖动改变 */
  if (horiz===null){
    if (Math.abs(mx)>6 || Math.abs(my)>6) horiz = Math.abs(mx) > Math.abs(my)*1.1;
    else return;
  }
  if (!horiz){ dg=false; stage.classList.remove('grabbing'); return; }  /* 竖滑：交还翻屏 */
  if (e.cancelable) e.preventDefault();
  place(base - mx/THRESH);          /* 跟手：直接渲染连续位置 */
}
function up(){
  if(!dg) return;
  dg=false; stage.classList.remove('grabbing');
  if (horiz && Math.abs(mx)>10){
    var raw = base - mx/THRESH;
    /* 单次手势最多走一张，避免一拖飞过好几张 */
    var step = Math.max(-1, Math.min(1, Math.round(raw - base)));
    setPos(base + step);
  } else {
    setPos(base);                   /* 未达阈值：吸回原位 */
  }
  setTimeout(function(){ horiz=null; mx=0; }, 40);
}

stage.addEventListener('mousedown', down);
window.addEventListener('mousemove', move, {passive:false});
window.addEventListener('mouseup', up);
stage.addEventListener('touchstart', down, {passive:false});
stage.addEventListener('touchmove', move, {passive:false});
stage.addEventListener('touchend', up);
stage.addEventListener('touchcancel', up);

/* 横向滚轮 / 触控板横扫：一次手势只翻一张 */
var wLast=0, wFired=false;
stage.addEventListener('wheel', function(e){
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  var now = Date.now();
  /* 间隔超过 190ms 视为新手势，重新允许触发 */
  if (now - wLast > 190) wFired = false;
  wLast = now;
  if (wFired) return;              /* 同一次惯性滚动内只认第一下 */
  if (Math.abs(e.deltaX) < 6) return;
  wFired = true;
  go(cur + (e.deltaX>0 ? 1 : -1));
}, {passive:false});

    var t=document.getElementById(b.getAttribute('data-scroll-target'));

  });
});

function setLanguage(lang){
  if (lang!=='zh' && lang!=='en') return;
  currentLang=lang;
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=I18N[lang].title;
  [].slice.call(document.querySelectorAll('[data-i18n]')).forEach(function(el){
    var key=el.getAttribute('data-i18n');
    if (!I18N[lang][key]) return;
    if(key==='hero.position' && lang==='zh') el.innerHTML='<span class="ai-tnr">AI</span> 产品、增长策略、国际传播';
    else el.textContent=I18N[lang][key];
  });
  [].slice.call(document.querySelectorAll('[data-i18n-placeholder]')).forEach(function(el){
    var key=el.getAttribute('data-i18n-placeholder');
    if(I18N[lang][key]) el.setAttribute('placeholder',I18N[lang][key]);
  });
  [].slice.call(document.querySelectorAll('.lang-switch button')).forEach(function(b){
    var on=b.getAttribute('data-lang')===lang;
    b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
  });
  wPrev.setAttribute('aria-label',I18N[lang].previous);
  wNext.setAttribute('aria-label',I18N[lang].next);
  renderNav(); renderCaps(); renderIntern(); renderWork(); setPos(pos); syncScroll();
  if(window.refreshAskHazel) window.refreshAskHazel();
  try{ localStorage.setItem('portfolio-language-v3',lang); }catch(err){}
}

[].slice.call(document.querySelectorAll('.lang-switch button[data-lang]')).forEach(function(b){
  b.addEventListener('click',function(){ setLanguage(b.getAttribute('data-lang')); });
});

var lastTop=-1, lastVh=-1, curSec=-1;
function syncScroll(){
  var top=scroller.scrollTop, vh=scroller.clientHeight;
  if (top===lastTop && vh===lastVh) return;
  lastTop=top; lastVh=vh;

  /* 按各 section 真实位置判定，兼容手机端不等高布局 */
  var probe = top + vh*0.34, idx = 0;
  for (var i=0;i<secs.length;i++){
    if (secs[i].offsetTop <= probe) idx = i;
  }
  if (idx!==curSec){
    curSec=idx;
    secs.forEach(function(s,i){ s.classList.toggle('in', i<=idx); });
    [].slice.call(nav.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===idx); });
  }
  var max=Math.max(1, scroller.scrollHeight - vh);
  progBar.style.width=Math.min(100,(top/max)*100).toFixed(1)+'%';
}
(function loop(){ syncScroll(); requestAnimationFrame(loop); })();

  function setOpen(open){
    panel.classList.toggle('open',open); panel.setAttribute('aria-hidden',String(!open));

    if(open&&!messages.children.length) addBot(COPY[currentLang].welcome);
  }
  function addEvidence(box,indexes){
    if(!indexes||!indexes.length)return;
    var copyList=currentLang==='en'?WORK_EN:WORK;
    var wrap=document.createElement('div');wrap.className='ask-evidence';
    indexes.forEach(function(index){
      var base=WORK[index], copy=copyList[index];if(!base||!copy)return;
      var card=document.createElement('a');card.className='evidence-card';card.href=base.u;card.target='_blank';card.rel='noopener';
      var img=document.createElement('img');img.src=base.img;img.alt=copy.t;
      var text=document.createElement('span');
      var title=document.createElement('b');title.textContent=copy.t;
      var meta=document.createElement('small');meta.innerHTML='<span class="metric">'+copy.big+'</span> · '+copy.bigK;
      text.appendChild(title);text.appendChild(meta);card.appendChild(img);card.appendChild(text);wrap.appendChild(card);
    });
    box.appendChild(wrap);
  }
  function addMessage(text,type,evidence){
    var box=document.createElement('div'); box.className='ask-msg '+type; box.textContent=text;
    if(type==='bot')addEvidence(box,evidence);
    messages.appendChild(box); messages.scrollTop=messages.scrollHeight;
  }
  function addBot(text,evidence){addMessage(text,'bot',evidence);}
  function choose(item){
    addMessage(item.q,'user'); window.setTimeout(function(){addBot(item.a,item.evidence);},120);
  }
  function renderPrompts(){
    prompts.innerHTML=''; COPY[currentLang].prompts.forEach(function(item){
      var b=document.createElement('button'); b.type='button'; b.textContent=item.q; b.addEventListener('click',function(){choose(item);}); prompts.appendChild(b);

  window.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('open'))setOpen(false);});

})();

/* 微信：复制微信号，并尝试唤起客户端 */
(function(){
  var btn=document.getElementById('wechatAction'), hint=document.getElementById('wechatHint');
  if(!btn||!hint)return;
  var wechatId='XuHxx1250', resetTimer=0;
  function fallbackCopy(text){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(err){}document.body.removeChild(ta);
  }
  function showCopied(){
    btn.classList.add('copied');hint.textContent=I18N[currentLang]['wechat.copied'];
    clearTimeout(resetTimer);resetTimer=setTimeout(function(){btn.classList.remove('copied');hint.textContent=I18N[currentLang]['wechat.hint'];},4200);
  }
  btn.addEventListener('click',function(){
    var copied=navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(wechatId):Promise.resolve(fallbackCopy(wechatId));
    copied.catch(function(){fallbackCopy(wechatId);}).then(showCopied);
    window.setTimeout(function(){window.location.href='weixin://';},90);
  });
})();
