<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐皓萱 Hazel Xu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --void:#f7f5f1;
  --ink:#1c1a17;
  --ink-2:rgba(28,26,23,.76);
  --ink-3:rgba(28,26,23,.54);
  --ink-4:rgba(28,26,23,.36);
  --hair:rgba(28,26,23,.14);
  --hair-2:rgba(28,26,23,.075);
  --gold:#a05a32;
  --gold-2:#8a4a28;
  --sky:#5b86b0;
  --serif:'Newsreader','Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Inter','Noto Sans SC',ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif;
  --bgimg:url('img/aura.jpg');
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);line-height:1.62;background:var(--void);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;background:none;border:0;cursor:pointer;color:inherit}
::selection{background:rgba(160,90,50,.16)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
svg{display:block}

/* 全站弥散光背景 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:var(--bgimg);background-size:cover;background-position:center;
  opacity:.88;
}
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(248,247,244,.12) 0%,transparent 30%,transparent 70%,rgba(248,247,244,.08) 100%);
}

.scroller{position:relative;z-index:3;height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.scroller::-webkit-scrollbar{width:0}
.sec{
  height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  padding:clamp(58px,7.4vh,92px) clamp(28px,5vw,96px) clamp(22px,3vh,42px);
}

/* 顶栏 */
.top{
  position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;
  padding:clamp(17px,2.2vh,26px) clamp(28px,5vw,96px);
}
.top .bd{font-family:var(--serif);font-size:15.5px;font-weight:400;letter-spacing:.01em}
.top nav{margin-left:auto;display:flex;gap:clamp(13px,1.8vw,28px)}
.top nav button{
  position:relative;padding:3px 1px;font-size:10.5px;font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-4);transition:color .4s;
}
.top nav button::after{
  content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .58s cubic-bezier(.19,1,.22,1);
}
.top nav button:hover{color:var(--ink-2)}
.top nav button.on{color:var(--ink)}
.top nav button.on::after{transform:scaleX(1)}

.prog{position:fixed;left:0;bottom:0;height:1px;width:100%;z-index:69;background:var(--hair-2)}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .24s linear}

.rise{opacity:0;transform:translateY(18px);transition:opacity .95s cubic-bezier(.19,1,.22,1),transform .95s cubic-bezier(.19,1,.22,1)}
.sec.in .rise{opacity:1;transform:none}
.sec.in .d1{transition-delay:.09s}
.sec.in .d2{transition-delay:.18s}
.sec.in .d3{transition-delay:.27s}

/* 板块标头：斜体衬线 + 长横线，非居中 */
.bh{display:flex;align-items:baseline;gap:clamp(11px,1.5vw,20px);flex-shrink:0}
.bh h2{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.4vw,22px);font-weight:400;letter-spacing:.005em;white-space:nowrap;color:var(--ink-2)}
.bh .rule{flex:1;height:1px;background:var(--hair);min-width:12px}
.bh .tag{font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap}

/* ============ 1 · 首页：非对称版面 ============ */
#s-home{
  display:grid;
  grid-template-columns:minmax(0,1.42fr) minmax(0,.86fr);
  grid-template-rows:auto minmax(0,1fr);
  column-gap:clamp(26px,4vw,74px);row-gap:clamp(15px,2.3vh,34px);
}
/* 左上：姓名 + 学历，错落排布 */
.lead{grid-column:1;grid-row:1;min-width:0}
.lead .ttl{font-family:var(--serif);font-size:clamp(46px,6.8vw,108px);font-weight:300;letter-spacing:-.04em;line-height:.9}
.lead .ttl em{font-style:italic;font-weight:300}
.lead .sub{margin-top:clamp(12px,1.9vh,22px);display:flex;align-items:center;gap:clamp(11px,1.5vw,20px);flex-wrap:wrap}
.lead .sub .lat{font-size:10.5px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.lead .sub .bar{width:clamp(18px,2.4vw,40px);height:1px;background:var(--hair)}
.lead .sub .rl{font-family:var(--serif);font-style:italic;font-size:13px;font-weight:400;color:var(--ink-2)}

/* 学历：紧跟姓名，缩进对齐 */
.edu{margin-top:clamp(18px,2.8vh,40px);display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);max-width:min(100%,540px)}
.edu .e{display:flex;align-items:baseline;gap:clamp(10px,1.3vw,18px);position:relative;padding-left:clamp(13px,1.5vw,22px);transition:padding-left .58s cubic-bezier(.19,1,.22,1)}
.edu .e::before{
  content:'';position:absolute;left:0;top:.62em;width:clamp(6px,.7vw,11px);height:1px;background:var(--ink-4);
  transition:width .58s cubic-bezier(.19,1,.22,1),background .4s;
}
.edu .e:hover{padding-left:clamp(20px,2.2vw,32px)}
.edu .e:hover::before{width:clamp(13px,1.4vw,21px);background:var(--gold)}
.edu .e b{font-family:var(--serif);font-size:clamp(15px,1.4vw,22px);font-weight:400;letter-spacing:-.015em;white-space:nowrap}
.edu .e s{text-decoration:none;font-size:clamp(10px,.82vw,12px);color:var(--ink-3);font-weight:400}
.edu .e u{text-decoration:none;font-size:10px;font-weight:400;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap;transition:color .4s}
.edu .e:hover u{color:var(--gold-2)}

/* 右上：肖像 + 能力叠加，不是并排卡片 */
.side{grid-column:2;grid-row:1;min-width:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:clamp(14px,1.8vw,30px)}
.side .pf{position:relative;width:min(100%,clamp(150px,17vw,250px));flex-shrink:0}
.side .pf img{width:100%;height:auto;max-height:34vh;object-fit:contain;object-position:bottom right;
  filter:none contrast(1.02) drop-shadow(0 14px 32px rgba(28,26,23,.1))}
/* 能力：错落列，非等分格 */
.caps{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(11px,1.7vh,22px);padding-top:clamp(4px,.8vh,12px)}
.capC{cursor:default;transition:transform .5s cubic-bezier(.19,1,.22,1)}
.capC:nth-child(2){margin-left:clamp(9px,1.3vw,22px)}
.capC:nth-child(3){margin-left:clamp(18px,2.6vw,44px)}
.capC:hover{transform:translateX(4px)}
.capC .v{font-family:var(--serif);font-size:clamp(23px,2.5vw,40px);font-weight:300;letter-spacing:-.035em;line-height:1;transition:color .45s}
.capC:hover .v{color:var(--gold-2)}
.capC .lb{font-size:10px;font-weight:400;margin-top:5px;color:var(--ink-2)}
.capC .sb{font-size:9px;font-weight:400;color:var(--ink-4);margin-top:2px;line-height:1.5}

/* 实习经历：非等分 —— 首个宽栏，其余窄栏 */
.xp{grid-column:1 / -1;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(11px,1.7vh,22px)}
.xpg{
  flex:1;min-height:0;display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;
  gap:0;
}
.xc{
  min-width:0;position:relative;display:flex;flex-direction:column;cursor:default;
  padding:clamp(13px,1.9vh,24px) clamp(13px,1.5vw,26px) clamp(11px,1.6vh,20px);
  transition:background .6s cubic-bezier(.19,1,.22,1);
}
.xc + .xc{border-left:1px solid var(--hair-2)}
/* 顶部亮线：当前项与 hover */
.xc::before{
  content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,var(--gold),rgba(160,90,50,0));
  transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.19,1,.22,1);
}
.xc:hover::before,.xc.now::before{transform:scaleX(1)}
.xc:hover{background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 72%)}
.xc.now{background:linear-gradient(180deg,rgba(160,90,50,.06),transparent 70%)}
.xc .wn{font-size:9px;font-weight:400;letter-spacing:.1em;color:var(--ink-4)}
.xc.now .wn{color:var(--gold-2)}
.xc .og{font-family:var(--serif);font-size:clamp(13px,1.24vw,19px);font-weight:400;letter-spacing:-.018em;line-height:1.3;margin-top:8px}
.xc.now .og{font-size:clamp(15px,1.5vw,24px)}
.xc .rl{font-size:9.5px;font-weight:400;color:var(--ink-3);margin-top:6px;line-height:1.5}
.xc .kn{margin-top:clamp(14px,2.4vh,32px)}
.xc .more{margin-top:clamp(14px,2.2vh,26px)}
.xc .kn .kv{font-family:var(--serif);font-size:clamp(24px,2.6vw,41px);font-weight:300;letter-spacing:-.04em;line-height:1;transition:color .5s}
.xc.now .kn .kv{font-size:clamp(30px,3.3vw,56px);color:var(--gold)}
.xc:hover .kn .kv{color:var(--gold-2)}
.xc .kn .kk{font-size:9px;font-weight:400;color:var(--ink-3);margin-top:7px;line-height:1.5}
.xc .more{padding-top:clamp(9px,1.3vh,14px);border-top:1px solid var(--hair-2);display:flex;flex-direction:column;gap:6px}
.xc .more i{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-4);display:flex;gap:8px;line-height:1.5}
.xc .more i b{font-weight:400;color:var(--ink-2);flex-shrink:0}

@media(max-width:1180px){
  #s-home{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
  .xpg{grid-template-columns:1.4fr 1fr 1fr;overflow-y:auto}
  .xc:nth-child(4){border-left:0}
}
@media(max-width:800px){
  #s-home{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .lead{grid-row:1}
  .side{grid-column:1;grid-row:2;max-height:20vh;align-items:flex-end}
  .side .pf{width:clamp(96px,26vw,140px)}
  .side .pf img{max-height:20vh}
  .caps{max-width:60%}
  .xp{grid-column:1;grid-row:3}
  .lead .ttl{font-size:clamp(34px,10vw,54px)}
  .xpg{grid-template-columns:1.3fr 1fr}
  .xc:nth-child(3){border-left:0}
  .xc .more{display:none}
}

/* ============ 2 · 作品 ============ */
#s-work{display:flex;flex-direction:column;gap:clamp(11px,1.7vh,24px)}
.wwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(11px,1.6vh,22px)}
.stage{flex:1;min-height:0;position:relative;perspective:2200px;perspective-origin:50% 46%}
.track{position:absolute;inset:0;transform-style:preserve-3d}

.fc{
  position:absolute;inset:0;margin:auto;
  width:clamp(292px,25.4vw,398px);height:min(93%,528px);
  transform-style:preserve-3d;cursor:pointer;
  transition:transform .96s cubic-bezier(.19,1,.22,1),opacity .62s,filter .62s;
}
.fc .face{
  position:absolute;inset:0;overflow:hidden;border-radius:14px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#ffffff;
  border:1px solid var(--hair-2);
}
.fc.on .face{border-color:var(--hair);box-shadow:0 18px 44px -20px rgba(28,26,23,.12),0 2px 8px rgba(28,26,23,.04)}

.fc .front{display:flex;flex-direction:column}
.fc .shot{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#f5f4f0;flex-shrink:0}
.fc .shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.35s cubic-bezier(.19,1,.22,1),filter .7s;filter:saturate(.96)}
.fc.on .shot img{filter:none}
.fc.on:hover .shot img{transform:scale(1.045)}
.fc .shot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 64%,rgba(252,251,248,.4));pointer-events:none}
.fc .num{
  position:absolute;top:14px;left:15px;z-index:3;
  font-family:var(--serif);font-size:11px;font-weight:400;letter-spacing:.1em;color:var(--ink);
  text-shadow:0 1px 7px rgba(255,255,255,.85);
}
.fc .flag{
  position:absolute;bottom:14px;right:15px;z-index:3;display:inline-flex;align-items:center;gap:7px;
  font-size:8.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);
  opacity:0;transform:translateY(5px);transition:opacity .55s,transform .55s;
}
.fc .flag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.5}
.fc.on .flag{opacity:1;transform:none}

.fc .meta{padding:clamp(16px,1.8vw,26px) clamp(17px,1.9vw,27px);display:flex;flex-direction:column;flex:1;min-height:0}
.fc .og{font-size:9px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.fc h3{font-family:var(--serif);font-size:clamp(16px,1.5vw,23px);font-weight:400;letter-spacing:-.022em;line-height:1.36;margin-top:10px}
.fc .bg{margin-top:clamp(13px,1.8vh,22px);display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.fc .bg .v{font-family:var(--serif);font-size:clamp(30px,3.1vw,48px);font-weight:300;line-height:1;letter-spacing:-.045em;color:var(--gold)}
.fc .bg .k{font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fc .why{
  margin-top:auto;padding-top:clamp(12px,1.7vh,18px);border-top:1px solid var(--hair-2);
  font-size:10.5px;font-weight:400;line-height:1.78;color:var(--ink-3);
}

.fc .back{
  background:#fcfbf8;
  transform:rotateY(180deg);
  padding:clamp(21px,2.3vw,36px);display:flex;flex-direction:column;justify-content:center;
}
.fc .back .og{color:var(--ink-4)}
.fc .back h4{font-family:var(--serif);font-size:clamp(16px,1.5vw,23px);font-weight:400;letter-spacing:-.022em;line-height:1.36;margin-top:10px}
.fc .back .bw{margin-top:11px;font-size:10.5px;font-weight:400;line-height:1.78;color:var(--ink-3)}
.fc .back .bl{margin-top:clamp(16px,2.3vh,28px)}
.fc .back .bl i{
  font-style:normal;display:flex;align-items:baseline;gap:14px;
  padding:clamp(7px,1.1vh,12px) 0;border-top:1px solid var(--hair-2);
  font-size:9.5px;font-weight:400;color:var(--ink-3);line-height:1.5;
}
.fc .back .bl i b{font-family:var(--serif);font-size:16px;font-weight:300;color:var(--ink);flex-shrink:0;min-width:88px;letter-spacing:-.03em}
.fc .back .go{
  margin-top:clamp(16px,2.5vh,30px);align-self:flex-start;display:inline-flex;align-items:center;gap:10px;
  font-size:9.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2);
  padding-bottom:6px;border-bottom:1px solid rgba(160,90,50,.36);
  transition:gap .5s,color .4s,border-color .4s;
}
.fc .back .go:hover{gap:16px;color:var(--gold);border-bottom-color:var(--gold)}
.fc .back .go svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.7}

.wfoot{flex-shrink:0;display:flex;align-items:center;gap:clamp(14px,1.9vw,30px);border-top:1px solid var(--hair-2);padding-top:clamp(11px,1.6vh,18px)}
.wnow{min-width:0;flex:1}
.wnow .l1{font-size:9px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.wnow .l2{font-family:var(--serif);font-size:clamp(14px,1.32vw,21px);font-weight:400;letter-spacing:-.022em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wnav{display:flex;align-items:center;gap:clamp(11px,1.4vw,20px);flex-shrink:0}
.wnav .cnt{font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--ink-4)}
.wnav .cnt b{color:var(--ink);font-weight:400}
.wnav button.ar{
  width:clamp(34px,3vw,40px);height:clamp(34px,3vw,40px);border-radius:50%;
  border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:all .42s cubic-bezier(.19,1,.22,1);
}
.wnav button.ar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}
.wnav button.ar:hover:not(:disabled){border-color:var(--gold);color:var(--gold);transform:scale(1.06)}
.wnav button.ar:disabled{opacity:.2}
.dotrow{display:flex;gap:7px;flex-shrink:0;align-items:center}
.dotrow button{width:5px;height:5px;border-radius:50%;background:var(--hair);transition:all .5s cubic-bezier(.19,1,.22,1)}
.dotrow button:hover{background:var(--ink-3)}
.dotrow button.on{background:var(--gold);width:22px;border-radius:999px}
@media(max-width:900px){
  .fc{width:clamp(230px,76vw,302px);height:min(89%,402px)}
  .dotrow,.wnow .l1{display:none}
  .fc .shot{aspect-ratio:16/11}
  .fc h3{font-size:15px;margin-top:8px}
  .fc .bg{margin-top:10px}.fc .bg .v{font-size:26px}
  .fc .why{font-size:10px;line-height:1.62;padding-top:9px}
  .fc .meta{padding:14px 15px}
}

/* ============ 3 · 名片 ============ */
#s-card{display:flex;flex-direction:column;gap:clamp(11px,1.7vh,24px)}
.cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:clamp(10px,2vh,30px)}
.card{
  position:relative;width:min(100%,clamp(340px,52vw,700px));
  background:#ffffff;
  border:1px solid var(--hair-2);border-radius:14px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,.36fr) minmax(0,1fr);
  box-shadow:0 20px 48px -20px rgba(28,26,23,.1),0 1px 4px rgba(28,26,23,.04);
  transition:transform .7s cubic-bezier(.19,1,.22,1),box-shadow .7s;
}
.card .cl{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border-right:1px solid var(--hair-2)}
.card .cl::before{content:'';position:absolute;inset:0;background:radial-gradient(closest-side at 50% 100%,rgba(160,90,50,.07),transparent 76%)}
.card .cl img{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:saturate(.96) contrast(1.02)}
.card .cr{padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;min-width:0}
.card .nm{font-family:var(--serif);font-size:clamp(26px,2.8vw,42px);font-weight:300;letter-spacing:-.038em;line-height:1.04}
.card .lt{font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.card .rl{
  margin-top:clamp(14px,2vh,22px);padding-top:clamp(14px,2vh,22px);border-top:1px solid var(--hair-2);
  font-family:var(--serif);font-size:clamp(12px,1vw,14.5px);font-weight:400;line-height:1.72;
}
.card .rl em{font-style:italic;display:block;color:var(--ink-3);margin-top:6px}
.card .iv{margin-top:clamp(13px,1.8vh,20px)}
.card .iv .il{font-size:9px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4)}
.card .iv .ic{margin-top:10px;display:flex;flex-wrap:wrap;gap:clamp(9px,1.2vw,18px)}
.card .iv .ic span{font-size:10.5px;font-weight:400;color:var(--ink-2);position:relative;transition:color .4s}
.card .iv .ic span::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .5s cubic-bezier(.19,1,.22,1)}
.card .iv .ic span:hover{color:var(--gold-2)}

var track=document.getElementById('track'), dots=document.getElementById('dots');

var cur=0, flipped={};

(function(){
  var h='';
  WORK.forEach(function(it,i){
    var rows='';

  });

var cards=[].slice.call(track.querySelectorAll('.fc'));

function layout(){
  cards.forEach(function(c,i){
    var off=i-cur, ab=Math.abs(off);
    var flip = flipped[i] ? 180 : 0;
    if (ab>2){
      c.style.opacity='0';c.style.pointerEvents='none';c.classList.remove('on');
      c.style.transform='translateX('+((off>0?1:-1)*780)+'px) translateZ(-1000px) scale(.6)';
      return;
    }
    var tx = off*(ab===1?292:506);
    var tz = ab===0 ? 0 : -448-(ab-1)*250;
    var ry = off===0 ? 0 : (off>0 ? -24 : 24);
    var sc = ab===0 ? 1 : .8-(ab-1)*.1;
    c.style.opacity = ab===0 ? '1' : (ab===1 ? '.4' : '.15');
    c.style.pointerEvents='auto';
    c.style.filter = ab===0 ? 'none' : 'blur('+(ab*1.4)+'px)';
    c.style.zIndex=String(30-ab);
    c.style.transform='translateX('+tx+'px) translateZ('+tz+'px) rotateY('+(ry+flip)+'deg) scale('+sc+')';
    c.classList.toggle('on', ab===0);
  });
  [].slice.call(dots.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===cur); });
  wPrev.disabled = cur===0;
  wNext.disabled = cur===cards.length-1;
  var it=WORK[cur];
  wOrg.textContent=it.org; wTitle.textContent=it.t;
  wCnt.innerHTML='<b>'+(cur+1<10?'0'+(cur+1):cur+1)+'</b> / '+cards.length;
}
function go(i){
  i=Math.max(0,Math.min(cards.length-1,i));
  if (i!==cur) flipped={};
  cur=i; layout();
}
cards.forEach(function(c,i){
  c.addEventListener('click', function(e){
    if (e.target.closest('.go')) return;
    if (i!==cur){ go(i); return; }
    flipped[i]=!flipped[i]; layout();
  });
});
wPrev.addEventListener('click', function(){ go(cur-1); });
wNext.addEventListener('click', function(){ go(cur+1); });
dots.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(b) go(parseInt(b.dataset.i,10));
});
layout();

(function(){
  var card=document.getElementById('card'), wrap=card.parentNode;
  wrap.addEventListener('mousemove', function(e){
    var r=card.getBoundingClientRect();
    var dx=(e.clientX-(r.left+r.width/2))/r.width;
    var dy=(e.clientY-(r.top+r.height/2))/r.height;
    card.style.transform='perspective(1400px) rotateY('+(dx*3.6).toFixed(2)+'deg) rotateX('+(-dy*2.8).toFixed(2)+'deg)';
  });
  wrap.addEventListener('mouseleave', function(){ card.style.transform=''; });
})();

var scroller=document.getElementById('scroller');
var secs=[].slice.call(scroller.querySelectorAll('.sec'));
var nav=document.getElementById('nav'), progBar=document.getElementById('progBar');

(function(){
  var h='';
  secs.forEach(function(s,i){ h += '<button data-i="'+i+'">'+s.dataset.nav+'</button>'; });
  nav.innerHTML=h;
  nav.addEventListener('click', function(e){
    var b=e.target.closest('button');
    if (b) scroller.scrollTo({top:parseInt(b.dataset.i,10)*scroller.clientHeight, behavior:'smooth'});
  });
})();

var lastTop=-1, lastVh=-1, curSec=-1;
function syncScroll(){
  var top=scroller.scrollTop, vh=scroller.clientHeight;
  if (top===lastTop && vh===lastVh) return;
  lastTop=top; lastVh=vh;
  var idx=Math.max(0,Math.min(secs.length-1,Math.round(top/vh)));
  if (idx!==curSec){
    curSec=idx;
    secs.forEach(function(s,i){ s.classList.toggle('in', i<=idx); });
    [].slice.call(nav.querySelectorAll('button')).forEach(function(b,j){ b.classList.toggle('on', j===idx); });
  }
  var max=Math.max(1,(secs.length-1)*vh);
  progBar.style.width=Math.min(100,(top/max)*100).toFixed(1)+'%';
}
(function loop(){ syncScroll(); requestAnimationFrame(loop); })();

window.addEventListener('keydown', function(e){
  if (Math.round(scroller.scrollTop/scroller.clientHeight)!==1) return;
  if (e.key==='ArrowRight'){ e.preventDefault(); go(cur+1); }
  if (e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
});
